<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HorrorWorld Multiplayer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;

    padding: 15px 20px;

    background: rgba(0,0,0,.7);
    color: white;

    border-radius: 12px;

    font-size: 17px;
}

#status {
    margin-top: 5px;
    color: #7cff7c;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.35);
}

#startBox {
    background: white;

    padding: 35px;

    border-radius: 15px;

    text-align: center;

    box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

button {
    border: none;

    padding: 15px 30px;

    border-radius: 10px;

    background: #222;
    color: white;

    font-size: 18px;

    cursor: pointer;
}

button:hover {
    background: #444;
}

#crosshair {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 12px;
    height: 12px;

    z-index: 5;

    pointer-events: none;
}

#crosshair::before {
    content: "";

    position: absolute;

    left: 5px;
    top: 0;

    width: 2px;
    height: 12px;

    background: white;
}

#crosshair::after {
    content: "";

    position: absolute;

    left: 0;
    top: 5px;

    width: 12px;
    height: 2px;

    background: white;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

    <div>
        Spieler:
        <span id="playerCount">0</span>
    </div>

    <div>
        Rolle:
        <span id="role">---</span>
    </div>

    <div id="status">
        Verbinde...
    </div>

</div>

<div id="crosshair"></div>


<div id="startScreen">

    <div id="startBox">

        <h1>HorrorWorld</h1>

        <p>Multiplayer-Test</p>

        <p>
            <b>WASD</b> = Laufen<br>
            <b>Shift</b> = Sprinten<br>
            <b>Space</b> = Springen<br>
            <b>Maus</b> = Kamera
        </p>

        <button id="startButton">
            SPIEL STARTEN
        </button>

    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    set,
    update,
    onValue,
    onDisconnect,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBiQVy6ItxzIhFqPI6ErUXsVw59IYu3Fos",

    authDomain:
        "horrorworld-1e247.firebaseapp.com",

    projectId:
        "horrorworld-1e247",

    storageBucket:
        "horrorworld-1e247.firebasestorage.app",

    messagingSenderId:
        "424446705755",

    appId:
        "1:424446705755:web:685456892782994530ff7e"
};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


/*
    WICHTIG:
    Deine Datenbank befindet sich in europe-west1.
*/

const db =
    getDatabase(
        app,
        "https://horrorworld-1e247-default-rtdb.europe-west1.firebasedatabase.app"
    );


/* =========================================================
   LOBBY
========================================================= */

const LOBBY_ID = "lobby1";


const lobbyPath =
    "games/main/lobbies/" +
    LOBBY_ID;


const playersPath =
    lobbyPath +
    "/players";


const monsterPath =
    lobbyPath +
    "/monsterId";


const playersRef =
    ref(
        db,
        playersPath
    );


const monsterRef =
    ref(
        db,
        monsterPath
    );


/* =========================================================
   HTML
========================================================= */

const game =
    document.getElementById("game");


const playerCountText =
    document.getElementById("playerCount");


const roleText =
    document.getElementById("role");


const statusText =
    document.getElementById("status");


const startScreen =
    document.getElementById("startScreen");


const startButton =
    document.getElementById("startButton");


/* =========================================================
   THREE.JS
========================================================= */

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x87ceeb
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        75,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.shadowMap.enabled =
    true;


game.appendChild(
    renderer.domElement
);


/* =========================================================
   LICHT
========================================================= */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );


sun.position.set(
    50,
    100,
    50
);


sun.castShadow =
    true;


scene.add(sun);


const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.2
    );


scene.add(
    ambient
);


/* =========================================================
   BODEN
========================================================= */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            300,
            300
        ),

        new THREE.MeshStandardMaterial({

            color:
                0x55aa55

        })

    );


ground.rotation.x =
    -Math.PI / 2;


ground.receiveShadow =
    true;


scene.add(
    ground
);


/* =========================================================
   STRASSE
========================================================= */

const road =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            20,
            0.1,
            300
        ),

        new THREE.MeshStandardMaterial({

            color:
                0x666666

        })

    );


road.position.y =
    0.05;


scene.add(
    road
);


/* =========================================================
   STRASSENLINIEN
========================================================= */

for (
    let z = -140;
    z <= 140;
    z += 12
) {

    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.5,
                0.12,
                6
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0xffffff

            })

        );


    line.position.set(
        0,
        0.12,
        z
    );


    scene.add(
        line
    );
}


/* =========================================================
   HÄUSER
========================================================= */

function createHouse(
    x,
    z
) {

    const house =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                12,
                6,
                10
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0xffd7a8

            })

        );


    body.position.y =
        3;


    body.castShadow =
        true;


    house.add(
        body
    );


    const roof =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                8.5,
                4,
                4
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0xaa3333

            })

        );


    roof.position.y =
        8;


    roof.rotation.y =
        Math.PI / 4;


    roof.castShadow =
        true;


    house.add(
        roof
    );


    const door =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2,
                3.5,
                0.2
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x553322

            })

        );


    door.position.set(
        0,
        1.75,
        5.1
    );


    house.add(
        door
    );


    house.position.set(
        x,
        0,
        z
    );


    scene.add(
        house
    );
}


createHouse(-35, -30);
createHouse(35, -70);
createHouse(-35, -110);

createHouse(35, 20);
createHouse(-35, 70);
createHouse(35, 120);


/* =========================================================
   BÄUME
========================================================= */

function createTree(
    x,
    z
) {

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                0.8,
                1,
                4,
                8
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x6b3f20

            })

        );


    trunk.position.y =
        2;


    tree.add(
        trunk
    );


    const leaves =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                3,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x228b22

            })

        );


    leaves.position.y =
        5;


    tree.add(
        leaves
    );


    tree.position.set(
        x,
        0,
        z
    );


    scene.add(
        tree
    );
}


const treePositions = [

    [-15, -20],
    [15, -40],
    [-15, -60],
    [15, -90],
    [-15, -100],
    [15, -130],

    [-60, -10],
    [60, -30],
    [-60, 40],
    [60, 60],
    [-60, 100],
    [60, 130]

];


for (
    const position
    of treePositions
) {

    createTree(
        position[0],
        position[1]
    );

}


/* =========================================================
   EIGENER SPIELER
========================================================= */

const player =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            0.6,
            1.2,
            8,
            16
        ),

        new THREE.MeshStandardMaterial({

            color:
                0x3366ff

        })

    );


player.position.set(
    0,
    1.2,
    10
);


player.castShadow =
    true;


scene.add(
    player
);


/* =========================================================
   SPIELER-VARIABLEN
========================================================= */

let uid = null;

let myRole = "player";

let started = false;

let grounded = true;

let velocityY = 0;

let yaw = 0;

let pitch = 0;

const keys = {};


/*
    Hier werden die anderen Spieler gespeichert.

    NICHT in Firebase!
    Nur lokal im Browser.
*/

const otherPlayers = {};


/* =========================================================
   TASTEN
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;


        if (
            event.code === "Space" &&
            grounded
        ) {

            velocityY =
                8;

            grounded =
                false;

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;

    }
);


/* =========================================================
   MAUS
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (!started)
            return;


        if (
            document.pointerLockElement !==
            renderer.domElement
        )
            return;


        yaw -=
            event.movementX *
            0.002;


        pitch -=
            event.movementY *
            0.002;


        pitch =
            Math.max(
                -1.4,
                Math.min(
                    1.4,
                    pitch
                )
            );

    }
);


renderer.domElement.addEventListener(
    "click",
    () => {

        if (started) {

            renderer.domElement.requestPointerLock();

        }

    }
);


/* =========================================================
   FIREBASE LOGIN
========================================================= */

async function login() {

    statusText.textContent =
        "Firebase Login...";


    try {

        await signInAnonymously(
            auth
        );

    } catch (error) {

        console.error(
            error
        );


        statusText.textContent =
            "Login Fehler";


        alert(
            "Firebase Login Fehler:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user)
            return;


        uid =
            user.uid;


        console.log(
            "MEINE UID:",
            uid
        );


        await connectPlayer();

    }
);


/* =========================================================
   SPIELER VERBINDEN
========================================================= */

async function connectPlayer() {

    /*
        Exakter Pfad des eigenen Spielers
    */

    const myPlayerRef =
        ref(
            db,
            playersPath +
            "/" +
            uid
        );


    console.log(
        "Lobby:",
        LOBBY_ID
    );


    console.log(
        "Player:",
        uid
    );


    /*
        Bei Disconnect löschen
    */

    onDisconnect(
        myPlayerRef
    ).remove();


    /*
        Monster auswählen.

        Nur der allererste Spieler
        bekommt die Monster-Rolle.
    */

    const transaction =
        await runTransaction(

            monsterRef,

            currentMonster => {

                if (
                    currentMonster === null
                ) {

                    return uid;

                }

                return currentMonster;

            }

        );


    const monsterId =
        transaction.snapshot.val();


    if (
        monsterId === uid
    ) {

        myRole =
            "monster";

    } else {

        myRole =
            "player";

    }


    roleText.textContent =
        myRole === "monster"
            ? "MONSTER"
            : "SPIELER";


    /*
        Eigene Daten speichern
    */

    await set(
        myPlayerRef,
        {

            x:
                player.position.x,

            y:
                player.position.y,

            z:
                player.position.z,

            rotation:
                yaw,

            role:
                myRole,

            joinedAt:
                Date.now()

        }
    );


    statusText.textContent =
        "Verbunden";


    /*
        WICHTIG:

        Wir hören auf den gesamten
        players-Ordner.
    */

    onValue(
        playersRef,

        snapshot => {

            const data =
                snapshot.val() || {};


            console.log(
                "SPIELER:",
                data
            );


            const count =
                Object.keys(
                    data
                ).length;


            playerCountText.textContent =
                count;


            if (
                count >= 2
            ) {

                statusText.textContent =
                    "2 Spieler verbunden!";

            } else {

                statusText.textContent =
                    "Warte auf Spieler...";

            }


            updateOtherPlayers(
                data
            );

        },

        error => {

            console.error(
                "Firebase Fehler:",
                error
            );


            statusText.textContent =
                "Firebase Fehler";

        }
    );


    /*
        Position senden.

        20 Updates pro Sekunde.
    */

    setInterval(
        async () => {

            if (!uid)
                return;


            try {

                await update(
                    myPlayerRef,
                    {

                        x:
                            player.position.x,

                        y:
                            player.position.y,

                        z:
                            player.position.z,

                        rotation:
                            yaw,

                        role:
                            myRole

                    }
                );

            } catch (error) {

                console.error(
                    "Position senden:",
                    error
                );

            }

        },
        50
    );

}


/* =========================================================
   ANDEREN SPIELER ERSTELLEN
========================================================= */

function createOtherPlayer(
    id,
    data
) {

    console.log(
        "Erstelle anderen Spieler:",
        id
    );


    const color =
        data.role === "monster"
            ? 0xff2222
            : 0x3366ff;


    const material =
        new THREE.MeshStandardMaterial({

            color:
                color

        });


    const mesh =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                0.6,
                1.2,
                8,
                16
            ),

            material

        );


    mesh.position.set(

        data.x ?? 0,

        data.y ?? 1.2,

        data.z ?? 0

    );


    mesh.rotation.y =
        data.rotation ?? 0;


    mesh.castShadow =
        true;


    scene.add(
        mesh
    );


    otherPlayers[id] =
        mesh;

}


/* =========================================================
   ANDERE SPIELER AKTUALISIEREN
========================================================= */

function updateOtherPlayers(
    data
) {

    /*
        Spieler erstellen / bewegen
    */

    for (
        const id in data
    ) {

        /*
            Eigenen Spieler überspringen
        */

        if (
            id === uid
        )
            continue;


        const playerData =
            data[id];


        /*
            Noch nicht vorhanden
        */

        if (
            !otherPlayers[id]
        ) {

            createOtherPlayer(
                id,
                playerData
            );

        }


        /*
            Spieler existiert bereits
        */

        else {

            const mesh =
                otherPlayers[id];


            /*
                Wir setzen das Ziel.

                Die eigentliche Bewegung
                wird unten weich interpoliert.
            */

            mesh.userData.targetX =
                playerData.x ?? 0;


            mesh.userData.targetY =
                playerData.y ?? 1.2;


            mesh.userData.targetZ =
                playerData.z ?? 0;


            mesh.userData.targetRotation =
                playerData.rotation ?? 0;


            /*
                Rolle / Farbe
            */

            if (
                playerData.role ===
                "monster"
            ) {

                mesh.material.color.set(
                    0xff2222
                );

            } else {

                mesh.material.color.set(
                    0x3366ff
                );

            }

        }

    }


    /*
        Spieler entfernen
    */

    for (
        const id in otherPlayers
    ) {

        if (
            !data[id]
        ) {

            scene.remove(
                otherPlayers[id]
            );


            delete otherPlayers[id];

        }

    }

}


/* =========================================================
   SYNCHRONISIERTE BEWEGUNG
========================================================= */

function smoothOtherPlayers() {

    for (
        const id in otherPlayers
    ) {

        const mesh =
            otherPlayers[id];


        /*
            Falls der Spieler gerade
            erst erstellt wurde
        */

        if (
            mesh.userData.targetX === undefined
        ) {

            continue;

        }


        /*
            Weiche Bewegung.

            Dadurch sieht die andere Figur
            nicht ruckelig aus.
        */

        mesh.position.x +=
            (
                mesh.userData.targetX -
                mesh.position.x
            ) * 0.35;


        mesh.position.y +=
            (
                mesh.userData.targetY -
                mesh.position.y
            ) * 0.35;


        mesh.position.z +=
            (
                mesh.userData.targetZ -
                mesh.position.z
            ) * 0.35;


        /*
            Rotation
        */

        mesh.rotation.y +=
            (
                mesh.userData.targetRotation -
                mesh.rotation.y
            ) * 0.35;

    }

}


/* =========================================================
   BEWEGUNG
========================================================= */

function movement(
    delta
) {

    if (!started)
        return;


    let speed = 7;


    if (
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
    ) {

        speed = 12;

    }


    let forward = 0;

    let right = 0;


    if (
        keys["KeyW"] ||
        keys["ArrowUp"]
    ) {

        forward++;

    }


    if (
        keys["KeyS"] ||
        keys["ArrowDown"]
    ) {

        forward--;

    }


    if (
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) {

        right++;

    }


    if (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) {

        right--;

    }


    const direction =
        new THREE.Vector3(
            right,
            0,
            -forward
        );


    if (
        direction.length() > 0
    ) {

        direction.normalize();


        direction.applyAxisAngle(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            yaw

        );


        player.position.x +=
            direction.x *
            speed *
            delta;


        player.position.z +=
            direction.z *
            speed *
            delta;

    }


    /*
        Gravitation
    */

    velocityY -=
        20 * delta;


    player.position.y +=
        velocityY * delta;


    if (
        player.position.y <= 1.2
    ) {

        player.position.y =
            1.2;

        velocityY =
            0;

        grounded =
            true;

    }


    /*
        Map-Grenzen
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -140,
            140
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -145,
            145
        );

}


/* =========================================================
   KAMERA
========================================================= */

function updateCamera() {

    const target =
        new THREE.Vector3(

            player.position.x,

            player.position.y + 1.5,

            player.position.z

        );


    const offset =
        new THREE.Vector3(
            0,
            0,
            5
        );


    offset.applyEuler(

        new THREE.Euler(

            pitch,
            yaw,
            0,
            "YXZ"

        )

    );


    camera.position.copy(
        target
    );


    camera.position.add(
        offset
    );


    camera.lookAt(
        target
    );

}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        started =
            true;


        startScreen.style.display =
            "none";


        renderer.domElement.requestPointerLock();

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function animate() {

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    const delta =
        Math.min(

            (now - lastTime) /
            1000,

            0.05

        );


    lastTime =
        now;


    movement(
        delta
    );


    smoothOtherPlayers();


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);


/* =========================================================
   START FIREBASE
========================================================= */

login();

</script>

</body>
</html>
