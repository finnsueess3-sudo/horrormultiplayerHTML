<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HorrorWorld</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      padding: 10px 15px;
      border-radius: 8px;
      background: rgba(0,0,0,.7);
      font-size: 14px;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      transform: translate(-50%, -50%);
      border: 2px solid white;
      border-radius: 50%;
      z-index: 5;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0,0,0,.65);
      padding: 15px;
      border-radius: 10px;
      min-width: 220px;
    }

    #role {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #players {
      margin-top: 8px;
      color: #bbb;
    }

    #help {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      padding: 12px;
      background: rgba(0,0,0,.65);
      border-radius: 10px;
      color: #ccc;
      font-size: 13px;
      line-height: 1.6;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #161616, #020202);
    }

    #startBox {
      text-align: center;
      padding: 35px;
      border: 1px solid #333;
      border-radius: 15px;
      background: rgba(10,10,10,.95);
      box-shadow: 0 0 50px rgba(255,0,0,.08);
    }

    #startBox h1 {
      font-size: 48px;
      margin: 0 0 10px;
      letter-spacing: 5px;
    }

    #startBox p {
      color: #aaa;
    }

    button {
      border: 0;
      padding: 14px 28px;
      border-radius: 8px;
      background: #9b111e;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #c01828;
    }
  </style>
</head>

<body>

<div id="game"></div>

<div id="status">
  🔴 Firebase: Verbinde...
</div>

<div id="crosshair"></div>

<div id="hud">
  <div id="role">Rolle: wird geladen...</div>
  <div id="players">Spieler: 0</div>
</div>

<div id="help">
  <b>Steuerung</b><br>
  WASD – Bewegen<br>
  SHIFT – Sprint<br>
  SPACE – Springen<br>
  F – Taschenlampe<br>
  Maus – Umschauen
</div>

<div id="start">
  <div id="startBox">
    <h1>HORRORWORLD</h1>
    <p>3D MULTIPLAYER HORROR</p>
    <br>
    <button id="startButton">SPIEL STARTEN</button>
  </div>
</div>

<script type="module">

/* =========================================================
   FIREBASE
   ========================================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  update,
  remove,
  onValue,
  onDisconnect,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyBiQVy6ItxzIhFqPI6ErUXsVw59IYu3Fos",
  authDomain: "horrorworld-1e247.firebaseapp.com",
  projectId: "horrorworld-1e247",
  storageBucket: "horrorworld-1e247.firebasestorage.app",
  messagingSenderId: "424446705755",
  appId: "1:424446705755:web:685456892782994530ff7e"
};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const db = getDatabase(firebaseApp);


/* =========================================================
   THREE.JS
   ========================================================= */

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   VARIABLES
   ========================================================= */

let myId = null;
let myPlayerRef = null;

let players = {};

let isMonster = false;

let gameStarted = false;

let flashlightOn = true;

const keys = {};

let velocityY = 0;

const speed = 5;

const sprintSpeed = 8;

const gravity = 18;

const jumpPower = 8;


/* =========================================================
   THREE SETUP
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x030303);

scene.fog = new THREE.FogExp2(
  0x050505,
  0.035
);


const camera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.1,
  500
);


camera.position.set(
  0,
  1.7,
  5
);


const renderer = new THREE.WebGLRenderer({
  antialias: true
});


renderer.setSize(
  innerWidth,
  innerHeight
);


renderer.setPixelRatio(
  Math.min(devicePixelRatio, 2)
);


renderer.shadowMap.enabled = true;


document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
   ========================================================= */

const ambient = new THREE.HemisphereLight(
  0x444444,
  0x080808,
  0.35
);

scene.add(ambient);


const moon = new THREE.DirectionalLight(
  0x778899,
  0.5
);

moon.position.set(
  30,
  50,
  20
);

moon.castShadow = true;

scene.add(moon);


/* =========================================================
   FLASHLIGHT
   ========================================================= */

const flashlight = new THREE.SpotLight(
  0xffffff,
  5,
  35,
  Math.PI / 7,
  0.5,
  1
);

flashlight.position.set(
  0,
  1.65,
  0
);

flashlight.target.position.set(
  0,
  1.5,
  -10
);

scene.add(flashlight);

scene.add(flashlight.target);


/* =========================================================
   GROUND
   ========================================================= */

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x151515,
    roughness: 1
  });


const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      300,
      300
    ),
    groundMaterial
  );


ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   ROAD
   ========================================================= */

const roadMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x202020
  });


const road =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      25,
      300
    ),
    roadMaterial
  );


road.rotation.x = -Math.PI / 2;

road.position.y = 0.01;

scene.add(road);


/* =========================================================
   HOUSE FUNCTION
   ========================================================= */

function createHouse(x, z) {

  const group = new THREE.Group();


  const wallMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x242424
    });


  const roofMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x101010
    });


  const walls =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        12,
        6,
        10
      ),
      wallMaterial
    );


  walls.position.y = 3;

  walls.castShadow = true;

  walls.receiveShadow = true;

  group.add(walls);


  const roof =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        8,
        4,
        4
      ),
      roofMaterial
    );


  roof.rotation.y =
    Math.PI / 4;

  roof.position.y = 8;

  roof.castShadow = true;

  group.add(roof);


  group.position.set(
    x,
    0,
    z
  );


  scene.add(group);
}


/* =========================================================
   HOUSES
   ========================================================= */

createHouse(-35, -25);
createHouse(35, -40);
createHouse(-40, 30);
createHouse(40, 25);
createHouse(-55, -65);
createHouse(55, -80);


/* =========================================================
   TREES
   ========================================================= */

function createTree(x, z) {

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .35,
        .5,
        4
      ),
      new THREE.MeshStandardMaterial({
        color: 0x24160e
      })
    );


  trunk.position.set(
    x,
    2,
    z
  );


  trunk.castShadow = true;

  scene.add(trunk);


  const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        2.5,
        8,
        8
      ),
      new THREE.MeshStandardMaterial({
        color: 0x101d12
      })
    );


  leaves.position.set(
    x,
    5,
    z
  );


  leaves.castShadow = true;

  scene.add(leaves);
}


for (
  let i = 0;
  i < 70;
  i++
) {

  const x =
    (Math.random() - .5) * 260;

  const z =
    (Math.random() - .5) * 260;


  if (
    Math.abs(x) < 20
  ) continue;


  createTree(
    x,
    z
  );
}


/* =========================================================
   CEMETERY
   ========================================================= */

function createGrave(x, z) {

  const grave =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.2,
        1.5,
        .4
      ),
      new THREE.MeshStandardMaterial({
        color: 0x333333
      })
    );


  grave.position.set(
    x,
    .75,
    z
  );


  grave.rotation.y =
    (Math.random() - .5) * .4;


  grave.castShadow = true;

  scene.add(grave);
}


for (
  let i = 0;
  i < 25;
  i++
) {

  createGrave(
    75 + (i % 5) * 3,
    40 + Math.floor(i / 5) * 4
  );
}


/* =========================================================
   PLAYER
   ========================================================= */

const player =
  new THREE.Group();


const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .35,
      1.0,
      4,
      8
    ),
    new THREE.MeshStandardMaterial({
      color: 0xdddddd
    })
  );


body.position.y = 1;

body.castShadow = true;

player.add(body);


scene.add(player);


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

let rotationY = 0;

let rotationX = 0;


document.addEventListener(
  "keydown",
  e => {

    keys[e.code] = true;


    if (
      e.code === "KeyF"
    ) {

      flashlightOn =
        !flashlightOn;

      flashlight.visible =
        flashlightOn;
    }
  }
);


document.addEventListener(
  "keyup",
  e => {

    keys[e.code] = false;

  }
);


document.addEventListener(
  "mousemove",
  e => {

    if (!gameStarted)
      return;


    rotationY -=
      e.movementX * 0.002;


    rotationX -=
      e.movementY * 0.002;


    rotationX =
      Math.max(
        -1.4,
        Math.min(
          1.4,
          rotationX
        )
      );
  }
);


renderer.domElement.addEventListener(
  "click",
  () => {

    if (
      gameStarted &&
      document.pointerLockElement !==
      renderer.domElement
    ) {

      renderer.domElement.requestPointerLock();

    }

  }
);


/* =========================================================
   JUMP
   ========================================================= */

document.addEventListener(
  "keydown",
  e => {

    if (
      e.code === "Space" &&
      Math.abs(velocityY) < 0.1
    ) {

      velocityY =
        jumpPower;

    }

  }
);


/* =========================================================
   FIREBASE LOGIN
   ========================================================= */

signInAnonymously(auth)
  .catch(error => {

    console.error(
      "Firebase Login Fehler:",
      error
    );

    document.getElementById(
      "status"
    ).textContent =
      "❌ Firebase Login Fehler";

  });


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if (!user)
      return;


    myId = user.uid;


    myPlayerRef =
      ref(
        db,
        "games/main/players/" +
        myId
      );


    document.getElementById(
      "status"
    ).textContent =
      "🟢 Firebase verbunden";


    /*
      Spieler registrieren
    */

    await set(
      myPlayerRef,
      {
        x: 0,
        y: 1,
        z: 5,
        rotation: 0,
        online: true,
        joinedAt: Date.now()
      }
    );


    /*
      Spieler automatisch entfernen,
      wenn Browser geschlossen wird
    */

    onDisconnect(
      myPlayerRef
    ).remove();


    /*
      Monster bestimmen
    */

    const monsterRef =
      ref(
        db,
        "games/main/monsterId"
      );


    const result =
      await runTransaction(
        monsterRef,
        current => {

          if (
            current === null
          ) {

            return myId;

          }

          return current;

        }
      );


    isMonster =
      result.snapshot.val() === myId;


    updateRoleUI();


    /*
      Andere Spieler beobachten
    */

    const playersRef =
      ref(
        db,
        "games/main/players"
      );


    onValue(
      playersRef,
      snapshot => {

        players =
          snapshot.val() || {};


        updatePlayers();

      }
    );

  }
);


/* =========================================================
   ROLE UI
   ========================================================= */

function updateRoleUI() {

  const role =
    document.getElementById(
      "role"
    );


  if (isMonster) {

    role.textContent =
      "👹 Rolle: MONSTER";

  } else {

    role.textContent =
      "🏃 Rolle: GEJAGTER";

  }

}


/* =========================================================
   PLAYER COUNT
   ========================================================= */

function updatePlayers() {

  const count =
    Object.keys(
      players
    ).length;


  document.getElementById(
    "players"
  ).textContent =
    "Spieler: " + count;


  /*
    Andere Spieler erstellen
  */

  for (
    const id in players
  ) {

    if (
      id === myId
    ) continue;


    const data =
      players[id];


    if (
      !data.mesh
    ) {

      const material =
        new THREE.MeshStandardMaterial({
          color:
            id === players.monsterId
              ? 0xff0000
              : 0x4488ff
        });


      const mesh =
        new THREE.Mesh(
          new THREE.CapsuleGeometry(
            .35,
            1,
            4,
            8
          ),
          material
        );


      mesh.castShadow =
        true;


      mesh.userData.playerId =
        id;


      scene.add(mesh);


      players[id].mesh =
        mesh;

    }


    const mesh =
      players[id].mesh;


    if (
      mesh
    ) {

      mesh.position.set(
        data.x || 0,
        data.y || 1,
        data.z || 0
      );

      mesh.rotation.y =
        data.rotation || 0;

    }

  }

}


/* =========================================================
   SEND POSITION
   ========================================================= */

let lastNetworkUpdate = 0;


function sendPosition(
  time
) {

  if (
    !myPlayerRef ||
    time - lastNetworkUpdate < 50
  ) return;


  lastNetworkUpdate =
    time;


  update(
    myPlayerRef,
    {
      x: player.position.x,
      y: player.position.y,
      z: player.position.z,
      rotation: rotationY,
      online: true
    }
  );

}


/* =========================================================
   START
   ========================================================= */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    () => {

      gameStarted =
        true;


      document.getElementById(
        "start"
      ).style.display =
        "none";


      renderer.domElement.requestPointerLock();

    }
  );


/* =========================================================
   GAME LOOP
   ========================================================= */

let previousTime =
  performance.now();


function animate(
  time
) {

  requestAnimationFrame(
    animate
  );


  const dt =
    Math.min(
      (time - previousTime) / 1000,
      .05
    );


  previousTime =
    time;


  if (
    gameStarted
  ) {

    let moveSpeed =
      keys["ShiftLeft"] ||
      keys["ShiftRight"]
        ? sprintSpeed
        : speed;


    let forward = 0;
    let sideways = 0;


    if (
      keys["KeyW"]
    ) forward += 1;

    if (
      keys["KeyS"]
    ) forward -= 1;

    if (
      keys["KeyA"]
    ) sideways -= 1;

    if (
      keys["KeyD"]
    ) sideways += 1;


    const direction =
      new THREE.Vector3(
        sideways,
        0,
        -forward
      );


    if (
      direction.length() > 0
    ) {

      direction.normalize();


      direction.applyAxisAngle(
        new THREE.Vector3(
          0,
          1,
          0
        ),
        rotationY
      );


      player.position.add(
        direction.multiplyScalar(
          moveSpeed * dt
        )
      );

    }


    /*
      Gravitation
    */

    velocityY -=
      gravity * dt;


    player.position.y +=
      velocityY * dt;


    if (
      player.position.y < 0
    ) {

      player.position.y =
        0;

      velocityY =
        0;

    }


    /*
      Kamera
    */

    camera.position.copy(
      player.position
    );


    camera.position.y +=
      1.7;


    camera.rotation.order =
      "YXZ";


    camera.rotation.y =
      rotationY;


    camera.rotation.x =
      rotationX;


    /*
      Taschenlampe folgt Kamera
    */

    flashlight.position.copy(
      camera.position
    );


    const target =
      new THREE.Vector3(
        0,
        0,
        -10
      );


    target.applyQuaternion(
      camera.quaternion
    );


    flashlight.target.position.copy(
      camera.position
    ).add(
      target
    );


    sendPosition(time);

  }


  renderer.render(
    scene,
    camera
  );

}


animate(
  performance.now()
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
</html>
