<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeerJS Test</title>

<style>
body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.box {
    width: 420px;
    max-width: 90%;
    background: #171717;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

input, button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    cursor: pointer;
    font-weight: bold;
}

#myId {
    margin: 20px 0;
    padding: 15px;
    background: #222;
    word-break: break-all;
}

#status {
    margin-top: 20px;
}
</style>

</head>

<body>

<div class="box">

<h1>HORROR WORLD</h1>

<p>Deine Peer-ID:</p>

<div id="myId">Verbinde mit PeerJS...</div>

<input
id="peerId"
placeholder="Peer-ID deines Freundes"

>

<button id="connect">
    VERBINDEN
</button>

<div id="status">
    Verbindung wird hergestellt...
</div>

</div>

<script type="module">

import Peer from
"https://esm.sh/peerjs@1.5.4";


// =====================================================
// PEER ERSTELLEN
// =====================================================

const peer = new Peer();


// =====================================================
// EIGENE ID
// =====================================================

peer.on("open", id => {

    document
        .getElementById("myId")
        .textContent = id;

    status(
        "🟢 PeerJS verbunden"
    );

    console.log(
        "MEINE PEER-ID:",
        id
    );

});


// =====================================================
// EINGEHENDE VERBINDUNG
// =====================================================

peer.on("connection", connection => {

    status(
        "🔵 Freund verbindet..."
    );

    connection.on("open", () => {

        status(
            "🟢 FREUND VERBUNDEN!"
        );

        connection.send({
            type: "hello"
        });

    });

    connection.on("data", data => {

        console.log(
            "Empfangen:",
            data
        );

    });

});


// =====================================================
// VERBINDEN
// =====================================================

document
    .getElementById("connect")
    .addEventListener("click", () => {

        const id =
            document
            .getElementById("peerId")
            .value
            .trim();

        if (!id) {

            status(
                "❌ Peer-ID eingeben"
            );

            return;
        }


        status(
            "🟡 Verbinde..."
        );


        const connection =
            peer.connect(
                id,
                {
                    reliable: true
                }
            );


        connection.on("open", () => {

            status(
                "🟢 FREUND VERBUNDEN!"
            );


            connection.send({
                type: "hello"
            });

        });


        connection.on("data", data => {

            console.log(
                "Empfangen:",
                data
            );

        });


        connection.on("error", error => {

            console.error(error);

            status(
                "❌ Verbindungsfehler"
            );

        });

    });


// =====================================================
// FEHLER
// =====================================================

peer.on("error", error => {

    console.error(
        "PeerJS:",
        error
    );

    status(
        "❌ PeerJS: " +
        error.type
    );

});


// =====================================================
// STATUS
// =====================================================

function status(text) {

    document
        .getElementById("status")
        .textContent =
        text;

}

</script>

</body>
</html>
