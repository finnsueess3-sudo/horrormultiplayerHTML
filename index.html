/* =====================================================
   HORROR SOUND ENGINE
===================================================== */

let audioCtx = null;

function startAudio(){

    if(audioCtx) return;

    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    const master =
        audioCtx.createGain();

    master.gain.value=.16;

    master.connect(
        audioCtx.destination
    );

    /* tiefer Horror-Drone */

    const drone =
        audioCtx.createOscillator();

    drone.type="sine";

    drone.frequency.value=43;

    const droneGain =
        audioCtx.createGain();

    droneGain.gain.value=.08;

    drone.connect(droneGain);
    droneGain.connect(master);

    drone.start();

    /* Wind */

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*2,
            audioCtx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){

        data[i] =
            (Math.random()*2-1)*.12;
    }

    const wind =
        audioCtx.createBufferSource();

    wind.buffer=buffer;
    wind.loop=true;

    const windFilter =
        audioCtx.createBiquadFilter();

    windFilter.type="lowpass";
    windFilter.frequency.value=500;

    const windGain =
        audioCtx.createGain();

    windGain.gain.value=.08;

    wind.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(master);

    wind.start();

    window.horrorMaster=master;
}


function soundMonster(){

    if(!audioCtx) return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type="sawtooth";

    osc.frequency.setValueAtTime(
        90,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        35,
        audioCtx.currentTime+.7
    );

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .45,
        audioCtx.currentTime+.05
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.8
    );

    osc.connect(gain);
    gain.connect(window.horrorMaster);

    osc.start();
    osc.stop(
        audioCtx.currentTime+.8
    );
}


function soundJump(){

    if(!audioCtx) return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type="square";

    osc.frequency.value=75;

    gain.gain.value=.5;

    osc.connect(gain);
    gain.connect(window.horrorMaster);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.45
    );

    osc.stop(
        audioCtx.currentTime+.45
    );
}

/* =====================================================

const obstacles=[];


function addObstacle(
    mesh
){

    obstacles.push(mesh);

}


function collides(
    pos,
    radius=.45,
    height=1.8
){

    const playerBox =
        new THREE.Box3().setFromCenterAndSize(

            new THREE.Vector3(
                pos.x,
                pos.y,
                pos.z
            ),

            new THREE.Vector3(
                radius*2,
                height,
                radius*2
            )
        );


    const box =
        new THREE.Box3();


    for(
        const object of obstacles
    ){

        box.setFromObject(object);

        if(
            playerBox.intersectsBox(box)
        ){

            return true;
        }
    }

    return false;
}


/* =====================================================

===================================================== */

function createHouse(
    x,
    z,
    scale=1
){

    const w=15*scale;
    const d=12*scale;
    const h=6*scale;

    const material =
        new THREE.MeshStandardMaterial({
            color:0x303235,
            roughness:.9
        });


    /* Rückwand */

    const back =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,.45*scale
            ),
            material
        );

    back.position.set(
        x,
        h/2,
        z-d/2
    );

    scene.add(back);
    addObstacle(back);


    /* Seiten */

    for(
        const side of [-1,1]
    ){

        const wall =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .45*scale,
                    h,
                    d
                ),
                material
            );

        wall.position.set(
            x+side*w/2,
            h/2,
            z
        );

        scene.add(wall);
        addObstacle(wall);
    }


    /* Vorderwand mit Türöffnung */

    const leftFront =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w*.32,
                h,
                .45*scale
            ),
            material
        );

    leftFront.position.set(
        x-w*.34,
        h/2,
        z+d/2
    );

    scene.add(leftFront);
    addObstacle(leftFront);


    const rightFront =
        leftFront.clone();

    rightFront.position.x =
        x+w*.34;

    scene.add(rightFront);
    addObstacle(rightFront);


    /* Tür */

    const door =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2,
                3.5,
                .18
            ),
            new THREE.MeshStandardMaterial({
                color:0x211713,
                roughness:.9
            })
        );

    door.position.set(
        x,
        1.75,
        z+d/2+.1
    );

    door.castShadow=true;

    scene.add(door);
    addObstacle(door);


    /* Fenster */

    for(
        const side of [-1,1]
    ){

        const window =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    2.2,
                    1.6,
                    .08
                ),
                new THREE.MeshStandardMaterial({
                    color:0x172936,
                    emissive:0x07151c,
                    emissiveIntensity:.5,
                    roughness:.15
                })
            );

        window.position.set(
            x+side*4.1*scale,
            3.7*scale,
            z+d/2+.25
        );

        scene.add(window);
    }


    /* Dach */

    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                w*.78,
                5*scale,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x151617,
                roughness:1
            })
        );

    roof.position.set(
        x,
        h+2.2*scale,
        z
    );

    roof.rotation.y=Math.PI/4;

    roof.castShadow=true;

    scene.add(roof);
}

function createCharacter(

){

    const body =

            new THREE.CapsuleGeometry(
                .35,1,8,12
            ),
            new THREE.MeshStandardMaterial({
                color:

                    ? 0x240000

                roughness:.8

    body.castShadow=true;

    group.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .31,16,16
            ),
            new THREE.MeshStandardMaterial({
                color:
                    monster
                    ? 0x140808

            })
        );

    head.castShadow=true;

    group.add(head);


    /* Augen */

            const x of [-.11,.11]

                    })
                );

            eye.position.set(
                x,
                1.95,
                -.27
            );

            group.add(eye);
        }
    }


    scene.add(group);

    return group;
}


const myCharacter =
    createCharacter(false);

myCharacter.visible=false;


/* =====================================================
   TASTEN
===================================================== */

window.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;


        if(
            e.code==="Space" &&
            player.grounded
        ){

            player.velocityY=7.5;
            player.grounded=false;
        }


        if(
            e.code==="KeyF" &&
            !e.repeat
        ){

            flashlightOn=
                !flashlightOn;

            flashlight.visible=
                flashlightOn;

            document.getElementById(
                "lightStatus"
            ).textContent=
                flashlightOn
                ? "🔦 Taschenlampe: AN"
                : "🔦 Taschenlampe: AUS";
        }


        if(
            e.code==="KeyQ" &&
            !e.repeat
        ){

            monsterAbility();
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* =====================================================
   MAUS
===================================================== */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement !==
            renderer.domElement
        )
            return;

        yaw-=e.movementX*.002;

        pitch-=e.movementY*.002;

        pitch=Math.max(
            -Math.PI/2,
            Math.min(
                Math.PI/2,
                pitch
            )
        );
    }
);


/* =====================================================
   START
===================================================== */

document.getElementById(
    "start"
).addEventListener(
    "click",
    async()=>{

        startAudio();

        if(audioCtx)
            await audioCtx.resume();

        renderer.domElement
            .requestPointerLock();

        document.getElementById(
            "start"
        ).style.display="none";
    }
);


/* =====================================================
   BEWEGUNG
===================================================== */

function movePlayer(dt){

    const direction =
        new THREE.Vector3();


    if(keys.KeyW)
        direction.z-=1;

    if(keys.KeyS)
        direction.z+=1;

    if(keys.KeyA)
        direction.x-=1;

    if(keys.KeyD)
        direction.x+=1;


    if(direction.length()>0){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );


        let speed =
            keys.ShiftLeft ||
            keys.ShiftRight
            ? player.sprintSpeed
            : player.walkSpeed;


        const nextX =
            player.position.clone();

        nextX.x+=
            direction.x*speed*dt;


        if(!collides(nextX))
            player.position.x=
                nextX.x;


        const nextZ =
            player.position.clone();

        nextZ.z+=
            direction.z*speed*dt;


        if(!collides(nextZ))
            player.position.z=
                nextZ.z;
    }


    player.velocityY-=18*dt;

    player.position.y+=
        player.velocityY*dt;


    if(player.position.y<=1){

        player.position.y=1;
        player.velocityY=0;
        player.grounded=true;
    }
}


/* =====================================================
   MONSTER Q
===================================================== */

function monsterAbility(){

    if(!isMonster)
        return;

    if(qCooldown>0)
        return;

    qCooldown=Q_COOLDOWN;

    let closest=null;
    let closestDistance=999;


    for(
        const id in remotePlayers
    ){

        const p=
            remotePlayers[id];

        if(p.data.monster)
            continue;


        const distance=
            player.position.distanceTo(
                p.group.position
            );

        if(distance<closestDistance){

            closestDistance=distance;
            closest=p;
        }
    }


    if(
        closest &&
        closestDistance<22
    ){

        monsterJumpscare(
            closest.group.position
        );

        soundJump();
    }
    else{

        soundMonster();
    }
}


/* =====================================================
   JUMPSCARE
===================================================== */

function monsterJumpscare(
    target
){

    const originalYaw=yaw;
    const originalPitch=pitch;

    const direction =
        target.clone().sub(
            camera.position
        ).normalize();


    const targetYaw =
        Math.atan2(
            -direction.x,
            -direction.z
        );


    let progress=0;

    const interval=
        setInterval(()=>{

            progress+=.06;

            yaw=
                THREE.MathUtils.lerp(
                    originalYaw,
                    targetYaw,
                    Math.min(progress,1)
                );

            pitch=
                0;

            if(progress>=1){

                clearInterval(interval);

                showJumpscare();
            }

        },30);
}


function showJumpscare(){

    const js=
        document.getElementById(
            "jumpscare"
        );

    const face=
        document.getElementById(
            "jumpscareFace"
        );


    js.style.opacity=1;

    face.style.transform=
        "scale(1.15)";


    soundJump();


    setTimeout(()=>{

        js.style.opacity=0;

        face.style.transform=
            "scale(.4)";

    },850);
}


/* =====================================================
   REMOTE PLAYERS
===================================================== */

const remotePlayers={};


function createRemote(
    data
){

    const group=
        createCharacter(
            data.monster
        );

    remotePlayers[data.id]={
        group,
        data
    };
}


function updateRemotePlayers(
    players
){

    const existing=
        new Set();


    for(
        const data of players
    ){

        if(data.id===myId)
            continue;


        existing.add(data.id);


        if(
            !remotePlayers[data.id]
        ){

            createRemote(data);
        }


        const remote=
            remotePlayers[data.id];


        remote.data=data;


        remote.group.position.set(
            data.x,
            data.y-1,
            data.z
        );


        remote.group.rotation.y=
            data.yaw;


        /* Monsterfarbe */

        const body=
            remote.group.children[0];

        body.material.color=
            data.monster
            ? 0x300000
            : 0x31506c;
    }


    for(
        const id in remotePlayers
    ){

        if(
            !existing.has(id)
        ){

            scene.remove(
                remotePlayers[id].group
            );

            delete remotePlayers[id];
        }
    }
}


/* =====================================================
   PEERJS MULTIPLAYER
===================================================== */

let peer=null;
let myId=null;
let connections=[];


/*
   WICHTIG:
   Für einen einfachen Test kannst du
   über URL ?room=ABC123 denselben Raum benutzen.
*/

const urlParams=
    new URLSearchParams(
        location.search
    );

let roomCode=
    urlParams.get("room");


function randomRoom(){

    return Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();
}


if(!roomCode){

    roomCode=randomRoom();

    history.replaceState(
        null,
        "",
        "?room="+roomCode
    );
}


document.getElementById(
    "status"
).textContent=
    "Raum: "+roomCode;


/* Host ist der erste Spieler */

let hostId=null;


function initPeer(){

    peer=
        new Peer(
            "horror-"+roomCode+
            "-"+Math.random()
                .toString(36)
                .substring(2,7)
        );


    peer.on(
        "open",
        id=>{

            myId=id;

            if(!hostId){

                hostId=id;

                isMonster=
                    Math.random()<.5;
            }

            updateRole();

            /* Verbindung versuchen */

            findHost();
        }
    );


    peer.on(
        "connection",
        conn=>{

            setupConnection(conn);
        }
    );
}


function findHost(){

    /*
      PeerJS hat keine Raumliste.
      Deshalb benutzen wir einen einfachen
      Host-Namen.
    */

    const hostName=
        "horror-host-"+roomCode;


    if(myId===hostName)
        return;


    const conn=
        peer.connect(
            hostName,
            {
                reliable:true
            }
        );


    setupConnection(conn);
}


function setupConnection(
    conn
){

    connections.push(conn);


    conn.on(
        "open",
        ()=>{

            conn.send({
                type:"state",
                id:myId,
                x:player.position.x,
                y:player.position.y,
                z:player.position.z,
                yaw,
                pitch,
                monster:isMonster
            });
        }
    );


    conn.on(
        "data",
        data=>{

            handleNetwork(
                data,
                conn
            );
        }
    );


    conn.on(
        "close",
        ()=>{

            connections=
                connections.filter(
                    c=>c!==conn
                );
        }
    );
}


function handleNetwork(
    data,
    conn
){

    if(data.type==="state"){

        const found=
            remotePlayers[data.id];


        if(!found){

            createRemote(data);

        }
        else{

            found.data=data;

            found.group.position.set(
                data.x,
                data.y-1,
                data.z
            );

            found.group.rotation.y=
                data.yaw;
        }
    }


    if(data.type==="role"){

        if(
            data.target===myId
        ){

            isMonster=
                data.monster;

            updateRole();
        }
    }


    if(data.type==="flash"){

        /* visueller Effekt */

        if(
            data.monster &&
            data.target===myId
        ){

            monsterJumpscare(
                new THREE.Vector3(
                    data.x,
                    data.y,
                    data.z
                )
            );
        }
    }
}


function sendState(){

    const state={
        type:"state",
        id:myId,
        x:player.position.x,
        y:player.position.y,
        z:player.position.z,
        yaw,
        pitch,
        monster:isMonster
    };


    for(
        const conn of connections
    ){

        if(
            conn.open
        ){

            conn.send(state);
        }
    }
}


function updateRole(){

    document.getElementById(
        "role"
    ).textContent=
        isMonster
        ? "👹 DU BIST DAS MONSTER"
        : "👤 DU WIRST GEJAGT";
}


initPeer();


/* =====================================================
   KAMERA
===================================================== */

function updateCamera(){

    camera.position.copy(
        player.position
    );

    camera.position.y+=.8;


    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;

    camera.rotation.x=pitch;


    flashlight.position.copy(
        camera.position
    );


    const direction=
        new THREE.Vector3(
            0,0,-1
        );

    direction.applyQuaternion(
        camera.quaternion
    );


    flashlight.target.position.copy(
        camera.position
    );


    flashlight.target.position.add(
        direction.multiplyScalar(30)
    );
}


/* =====================================================
   MONSTER-NÄHE
===================================================== */

function checkMonsterDistance(){

    let danger=false;

    for(
        const id in remotePlayers
    ){

        const p=
            remotePlayers[id];

        if(!p.data.monster)
            continue;


        const distance=
            player.position.distanceTo(
                p.group.position
            );


        if(distance<25){

            danger=true;

            const warning=
                document.getElementById(
                    "warning"
                );

            warning.style.opacity=
                Math.max(
                    0,
                    1-distance/25
                );

            if(
                distance<12
            ){

                warning.textContent=
                    "👹 DAS MONSTER IST SEHR NAH";
            }
        }
    }


    if(!danger){

        document.getElementById(
            "warning"
        ).style.opacity=0;
    }
}


/* =====================================================
   COOLDOWN
===================================================== */

function updateCooldown(dt){

    if(qCooldown>0){

        qCooldown-=dt;

        if(qCooldown<0)
            qCooldown=0;
    }


    document.getElementById(
        "cooldown"
    ).textContent=
        isMonster
        ?
        qCooldown>0
            ? "Q: "+qCooldown.toFixed(1)+" s"
            : "Q: bereit"
        :
        "Q: Monster-Fähigkeit";
}


/* =====================================================
   GAME LOOP
===================================================== */

let last=
    performance.now();

let sendTimer=0;


function animate(time){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(
            (time-last)/1000,
            .05
        );

    last=time;


    movePlayer(dt);


    sendTimer+=dt;

    if(sendTimer>.05){

        sendTimer=0;

        sendState();
    }


    checkMonsterDistance();

    updateCooldown(dt);

    updateCamera();


    document.getElementById(
        "status"
    ).textContent=
        isMonster
        ? "👹 MONSTER – JAGE DIE ANDEREN"
        : "👤 GEJAGT – ÜBERLEBE";


    renderer.render(
        scene,
        camera
    );
}


animate(
    performance.now()
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
