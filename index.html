}

<div id="menu">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ======================================================
// MULTIPLAYER
// ======================================================

const LOBBY_ID =
    "horror-world-lobby-2026";

let peer;
let myId;
let host = false;
let isMonster = false;

const connections = [];

const players = {};

let connected = false;


// ======================================================
// PEERJS
// ======================================================

function startPeer(){

    peer = new Peer(LOBBY_ID,{
        debug:1
    });

    peer.on("open",id=>{

        myId=id;
        host=true;
        isMonster=true;

        connected=true;

        createNetworkPlayer();

        updateRole();

        document.getElementById(
            "connection"
        ).textContent =
            "Lobby erstellt – du bist das Monster.";

    });


    peer.on("error",err=>{

        console.log("Peer:",err.type);

        if(
            err.type==="unavailable-id"
        ){

            host=false;

            peer.destroy();

            setTimeout(
                joinLobby,
                300
            );
        }

    });


    peer.on("connection",conn=>{

        if(!host)
            return;

        setupConnection(conn);

    });

}


function joinLobby(){

    peer = new Peer();

    peer.on("open",id=>{

        myId=id;

        const conn =
            peer.connect(
                LOBBY_ID,
                {
                    reliable:true
                }
            );

        setupConnection(conn);

    });

}


function setupConnection(conn){

    conn.on("open",()=>{

        if(
            !connections.includes(conn)
        ){

            connections.push(conn);

        }


        connected=true;


        if(host){

            conn.send({

                type:"welcome",

                monster:false,

                players:getNetworkPlayers()

            });

        }

    });


    conn.on("data",data=>{

        handleNetworkData(
            data,
            conn
        );

    });


    conn.on("close",()=>{

        const index =
            connections.indexOf(conn);

        if(index>=0)
            connections.splice(index,1);

    });

}


function broadcast(data,except=null){

    for(
        const conn
        of connections
    ){

        if(
            conn!==except &&
            conn.open
        ){

            conn.send(data);

        }

    }

}


// ======================================================
// NETWORK PLAYER
// ======================================================

function createNetworkPlayer(){

    players[myId]={
        id:myId,
        x:player.position.x,
        y:player.position.y,
        z:player.position.z,
        yaw:0,
        monster:isMonster
    };

}


function getNetworkPlayers(){

    return Object.values(players);

}


function sendState(){

    if(!connected)
        return;


    const data={

        type:"state",

        id:myId,

        x:player.position.x,

        y:player.position.y,

        z:player.position.z,

        yaw:yaw,

        monster:isMonster

    };


    if(host){

        players[myId]={
            ...players[myId],
            ...data
        };

        broadcast(data);

    }else{

        for(
            const conn
            of connections
        ){

            if(conn.open){

                conn.send(data);

            }

        }

    }

}


function handleNetworkData(data,conn){

    if(
        data.type==="welcome"
    ){

        isMonster=false;

        updateRole();

        if(
            data.players
        ){

            for(
                const p
                of data.players
            ){

                players[p.id]=p;

                if(
                    p.id!==myId
                )
                    createRemote(p);

            }

        }

        conn.send({

            type:"join",

            id:myId,

            x:player.position.x,

            y:player.position.y,

            z:player.position.z,

            monster:false

        });

    }


    if(
        data.type==="join"
    ){

        players[data.id]=data;

        createRemote(data);

        broadcast(
            data,
            conn
        );

    }


    if(
        data.type==="state"
    ){

        players[data.id]=data;

        updateRemote(data);

        if(host)
            broadcast(data,conn);

    }


    if(
        data.type==="flash"
    ){

        if(
            data.owner!==myId
        ){

            explodeFlashbang(
                new THREE.Vector3(
                    data.x,
                    data.y,
                    data.z
                ),
                data.strength
            );

        }

    }


    if(
        data.type==="monsterAbility"
    ){

        if(
            data.target===myId
        ){

            monsterJumpscare();

        }

    }


    if(
        data.type==="dead"
    ){

        if(
            data.target===myId
        ){

            loseGame();

        }

    }

}


// ======================================================
// 3D SCENE
// ======================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x030504);

scene.fog =
    new THREE.FogExp2(
        0x050806,
        .012
    );


// ======================================================
// CAMERA
// ======================================================

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .1,
        500
    );


// ======================================================
// RENDERER
// ======================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


// ======================================================
// LIGHT
// ======================================================

scene.add(
    new THREE.HemisphereLight(
        0x44505a,
        0x080a08,
        .35
    )
);


const moon =
    new THREE.DirectionalLight(
        0x73849a,
        1.2
    );

moon.position.set(
    -40,
    70,
    -30
);

moon.castShadow=true;

moon.shadow.mapSize.width=2048;
moon.shadow.mapSize.height=2048;

scene.add(moon);


// ======================================================
// TASCHENLAMPE
// ======================================================

let flashlightOn=true;

const flashlight =
    new THREE.SpotLight(
        0xffffff,
        8,
        60,
        Math.PI/7,
        .35,
        1
    );

flashlight.castShadow=true;

scene.add(flashlight);
scene.add(flashlight.target);


// ======================================================
// WORLD
// ======================================================

const obstacles=[];


const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            240,
            240
        ),

        new THREE.MeshStandardMaterial({
            color:0x111812,
            roughness:1
        })

    );

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


// ======================================================
// WÄNDE
// ======================================================

function wall(
    x,
    y,
    z,
    w,
    h,
    d,
    color=0x303331
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                w,h,d
            ),

            new THREE.MeshStandardMaterial({
                color,
                roughness:.9
            })

        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    obstacles.push(mesh);

    return mesh;

}


// ======================================================
// HAUS
// ======================================================

function house(x,z,s=1){

    const w=16*s;
    const d=13*s;
    const h=6*s;

    wall(
        x,
        h/2,
        z-d/2,
        w,
        h,
        .5*s
    );

    wall(
        x-w/2,
        h/2,
        z,
        .5*s,
        h,
        d
    );

    wall(
        x+w/2,
        h/2,
        z,
        .5*s,
        h,
        d
    );

    wall(
        x-w*.32,
        h/2,
        z+d/2,
        w*.35,
        h,
        .5*s
    );

    wall(
        x+w*.32,
        h/2,
        z+d/2,
        w*.35,
        h,
        .5*s
    );


    // Dach

    const roof =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                w*.75,
                5*s,
                4
            ),

            new THREE.MeshStandardMaterial({
                color:0x151615,
                roughness:1
            })

        );

    roof.position.set(
        x,
        h+2.5*s,
        z
    );

    roof.rotation.y=Math.PI/4;

    roof.castShadow=true;

    scene.add(roof);


    // Fenster

    for(
        const wx
        of [-w*.3,w*.3]
    ){

        const windowMesh =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    2*s,
                    1.5*s,
                    .1
                ),

                new THREE.MeshStandardMaterial({
                    color:0x5f704e,
                    emissive:0x243018,
                    emissiveIntensity:1
                })

            );

        windowMesh.position.set(
            x+wx,
            h*.6,
            z+d/2+.3
        );

        scene.add(windowMesh);

    }

}


house(18,-20,1.5);
house(-25,-35,1.3);
house(35,25,1.4);
house(-40,35,1.2);
house(5,-65,1.1);


// ======================================================
// GRABSTEINE
// ======================================================

function grave(x,z){

    const stone =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .8,
                1.2,
                .25
            ),

            new THREE.MeshStandardMaterial({
                color:0x484b48,
                roughness:1
            })

        );

    stone.position.set(
        x,
        .6,
        z
    );

    stone.castShadow=true;

    scene.add(stone);

    obstacles.push(stone);

}


function createGraveyard(){

    for(
        let i=0;
        i<45;
        i++
    ){

        const x=
            -55+
            Math.random()*30;

        const z=
            -5+
            Math.random()*50;

        grave(x,z);

    }


    // Kapelle

    wall(
        -40,
        2.5,
        20,
        10,
        5,
        7,
        0x252625
    );

}


createGraveyard();


// ======================================================
// BÄUME
// ======================================================

function tree(x,z,s=1){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .45*s,
                .65*s,
                5*s,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x2b1d15
            })

        );

    trunk.position.set(
        x,
        2.5*s,
        z
    );

    trunk.castShadow=true;

    scene.add(trunk);

    obstacles.push(trunk);


    const leaves =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                3*s,
                7*s,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x0c1710,
                roughness:1
            })

        );

    leaves.position.set(
        x,
        7*s,
        z
    );

    leaves.castShadow=true;

    scene.add(leaves);

}


for(
    let i=0;
    i<150;
    i++
){

    const x =
        (Math.random()<.5?-1:1)*
        (48+Math.random()*55);

    const z =
        -100+
        Math.random()*200;

    tree(
        x,
        z,
        .7+
        Math.random()*.9
    );

}


// ======================================================
// KERZEN
// ======================================================

function candle(x,z){

    const wax =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .12,
                .12,
                .7,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0xd8d0b0
            })

        );

    wax.position.set(
        x,
        .35,
        z
    );

    scene.add(wax);


    const flame =
        new THREE.PointLight(
            0xff9d42,
            3,
            8
        );

    flame.position.set(
        x,
        .9,
        z
    );

    scene.add(flame);

}


for(
    let i=0;
    i<25;
    i++
){

    candle(
        -45+
        Math.random()*25,

        5+
        Math.random()*40
    );

}


// ======================================================
// PLAYER
// ======================================================

const player={

    position:
        new THREE.Vector3(
            0,
            1,
            10
        ),

    velocityY:0,

    height:1.8,

    radius:.38,

    grounded:true,

    walkSpeed:6,

    sprintSpeed:10

};


// ======================================================
// PLAYER PHYSIK
// ======================================================

function collides(pos){

    const playerBox =
        new THREE.Box3();

    playerBox.setFromCenterAndSize(

        new THREE.Vector3(
            pos.x,
            pos.y,
            pos.z
        ),

        new THREE.Vector3(
            player.radius*2,
            player.height,
            player.radius*2
        )

    );


    const box =
        new THREE.Box3();


    for(
        const obstacle
        of obstacles
    ){

        box.setFromObject(
            obstacle
        );

        if(
            playerBox.intersectsBox(box)
        )
            return true;

    }

    return false;

}


function movePlayer(dt){

    const dir =
        new THREE.Vector3();


    if(keys.KeyW)dir.z-=1;
    if(keys.KeyS)dir.z+=1;
    if(keys.KeyA)dir.x-=1;
    if(keys.KeyD)dir.x+=1;


    if(dir.length()>0){

        dir.normalize();

        dir.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );


        const sprint =
            keys.ShiftLeft ||
            keys.ShiftRight;


        const speed =
            sprint
            ?player.sprintSpeed
            :player.walkSpeed;


        const nextX =
            player.position.clone();

        nextX.x +=
            dir.x*
            speed*
            dt;


        if(
            !collides(nextX)
        ){

            player.position.x=
                nextX.x;

        }


        const nextZ =
            player.position.clone();

        nextZ.z +=
            dir.z*
            speed*
            dt;


        if(
            !collides(nextZ)
        ){

            player.position.z=
                nextZ.z;

        }

    }


    // Gravitation

    player.velocityY -=
        19.6*dt;


    player.position.y +=
        player.velocityY*dt;


    if(
        player.position.y<=1
    ){

        player.position.y=1;

        player.velocityY=0;

        player.grounded=true;

    }

}


// ======================================================
// TASTEN
// ======================================================

const keys={};


window.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;


        if(
            e.code==="Space" &&
            player.grounded
        ){

            player.velocityY=7;

            player.grounded=false;

        }


        if(
            e.code==="KeyF" &&
            !e.repeat
        ){

            flashlightOn=
                !flashlightOn;

            flashlight.visible=
                flashlightOn;

            document.getElementById(
                "flashlight"
            ).textContent=
                flashlightOn
                ?"🔦 Taschenlampe: AN"
                :"🔦 Taschenlampe: AUS";

        }


        if(
            e.code==="KeyQ" &&
            !e.repeat
        ){

            ability();

        }

    });


window.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    });


// ======================================================
// MAUS
// ======================================================

let yaw=0;
let pitch=0;


document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement
            !==renderer.domElement
        )
            return;


        yaw -=
            e.movementX*.002;

        pitch -=
            e.movementY*.002;


        pitch=
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );

    });


// ======================================================
// START
// ======================================================

document.getElementById(
    "startButton"
).onclick=()=>{

    renderer.domElement
        .requestPointerLock();

    document.getElementById(
        "menu"
    ).style.display="none";

};


// ======================================================
// KAMERA
// ======================================================

function updateCamera(){

    camera.position.copy(
        player.position
    );

    camera.position.y+=.75;

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;

    camera.rotation.x=pitch;


    flashlight.position.copy(
        camera.position
    );


    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    dir.applyQuaternion(
        camera.quaternion
    );


    flashlight.target.position.copy(
        camera.position
    );

    flashlight.target.position.add(
        dir.multiplyScalar(25)
    );

}


// ======================================================
// REMOTE PLAYERS
// ======================================================

const remoteMeshes={};


function createRemote(data){

    if(
        remoteMeshes[data.id]
    )
        return;


    const group =
        new THREE.Group();


    // Körper

    const body =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .32,
                .8,
                8,
                12
            ),

            new THREE.MeshStandardMaterial({
                color:
                    data.monster
                    ?0x180000
                    :0x334d61
            })

        );

    body.position.y=.85;

    body.castShadow=true;

    group.add(body);


    // Kopf

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .28,
                16,
                16
            ),

            new THREE.MeshStandardMaterial({
                color:
                    data.monster
                    ?0x260000
                    :0xb0a095
            })

        );

    head.position.y=1.7;

    head.castShadow=true;

    group.add(head);


    // Monster Augen

    if(data.monster){

        for(
            const x
            of [-.1,.1]
        ){

            const eye =
                new THREE.Mesh(

                    new THREE.SphereGeometry(
                        .055,
                        8,
                        8
                    ),

                    new THREE.MeshBasicMaterial({
                        color:0xff0000
                    })

                );

            eye.position.set(
                x,
                1.73,
                -.25
            );

            group.add(eye);

        }

    }


    scene.add(group);


    remoteMeshes[data.id]=group;

}


function updateRemote(data){

    if(
        data.id===myId
    )
        return;


    createRemote(data);


    const mesh =
        remoteMeshes[data.id];


    mesh.position.set(
        data.x,
        data.y-1,
        data.z
    );

    mesh.rotation.y=data.yaw;


    // Monsterfarbe

    if(data.monster){

        mesh.children[0]
            .material.color.set(
                0x180000
            );

    }

}


// ======================================================
// MONSTER / GEJAGTE
// ======================================================

function updateRole(){

    document.getElementById(
        "role"
    ).textContent=

        isMonster
        ?"👹 DU BIST DAS MONSTER"
        :"👤 DU WIRST GEJAGT";

}


function checkMonster(){

    if(!isMonster)
        return;


    for(
        const id in players
    ){

        if(id===myId)
            continue;


        const p=
            players[id];


        if(!p || p.monster)
            continue;


        const distance =
            player.position.distanceTo(
                new THREE.Vector3(
                    p.x,
                    p.y,
                    p.z
                )
            );


        if(
            distance<1.5
        ){

            broadcast({

                type:"dead",

                target:id

            });


        }

    }

}


// ======================================================
// Q FÄHIGKEIT
// ======================================================

let abilityCooldown=0;


function ability(){

    if(
        abilityCooldown>0
    )
        return;


    abilityCooldown=6;


    if(isMonster){

        let closest=null;

        let distance=999;


        for(
            const id in players
        ){

            const p=players[id];

            if(
                p.monster
            )
                continue;


            const d=
                player.position.distanceTo(
                    new THREE.Vector3(
                        p.x,
                        p.y,
                        p.z
                    )
                );


            if(
                d<distance
            ){

                distance=d;
                closest=p;

            }

        }


        // Monster zieht Kamera an

        if(
            closest &&
            distance<18
        ){

            broadcast({

                type:"monsterAbility",

                target:closest.id

            });

        }

    }else{

        // Schwache Flashbang

        throwFlashbang();

    }

}


// ======================================================
// FLASHBANG
// ======================================================

function throwFlashbang(){

    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    dir.applyQuaternion(
        camera.quaternion
    );


    const pos =
        camera.position.clone();


    pos.add(
        dir.clone().multiplyScalar(3)
    );


    explodeFlashbang(
        pos,
        .45
    );


    broadcast({

        type:"flash",

        owner:myId,

        x:pos.x,

        y:pos.y,

        z:pos.z,

        strength:.45

    });

}


function explodeFlashbang(
    position,
    strength=1
){

    const light =
        new THREE.PointLight(
            0xffffff,
            100*strength,
            40
        );

    light.position.copy(
        position
    );

    scene.add(light);


    let power=1;


    const interval=
        setInterval(()=>{

            power*=.78;

            light.intensity=
                100*
                strength*
                power;


            if(
                power<.02
            ){

                clearInterval(
                    interval
                );

                scene.remove(light);

            }

        },40);


    flashScreen(
        position,
        strength
    );

}


// ======================================================
// SCREEN FLASH
// ======================================================

function flashScreen(
    position,
    strength
){

    const distance=
        camera.position.distanceTo(
            position
        );


    const max=30;


    if(distance>max)
        return;


    let power=
        1-
        distance/max;


    power=
        Math.pow(
            Math.max(0,power),
            .7
        );


    power*=strength;


    const flash=
        document.getElementById(
            "flash"
        );


    flash.style.opacity=
        Math.min(
            1,
            power
        );


    setTimeout(
        ()=>{

            flash.style.opacity=
                power*.35;

        },
        120
    );


    setTimeout(
        ()=>{

            flash.style.opacity=0;

        },
        700
    );

}

// MONSTER JUMPSCARE

// VERLOREN
// ======================================================

function loseGame(){

    document.exitPointerLock();

    document.getElementById(
        "dead"
    ).style.display="flex";

}


// ======================================================
// ATMOSPHÄRE
// ======================================================

let audioStarted=false;
let audioCtx;


function startAudio(){

    if(audioStarted)
        return;

    audioStarted=true;

    audioCtx=
        new AudioContext();


    // tiefer Horror-Droneton

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();


    osc.frequency.value=48;

    gain.gain.value=.025;

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

}


document.addEventListener(
    "click",
    startAudio,
    {once:true}
);


// ======================================================
// DANGER
// ======================================================

function dangerEffect(){

    if(!isMonster){

        let nearest=999;


        for(
            const id in players
        ){

            const p=players[id];

            if(
                p.monster
            ){

                const d=
                    player.position.distanceTo(
                        new THREE.Vector3(
                            p.x,
                            p.y,
                            p.z
                        )
                    );

                nearest=
                    Math.min(
                        nearest,
                        d
                    );

            }

        }


        if(nearest<15){

            const intensity=
                1-nearest/15;

            document.getElementById(
                "danger"
            ).style.opacity=
                intensity*.7;

        }else{

            document.getElementById(
                "danger"
            ).style.opacity=0;

        }

    }

}


// ======================================================
// ANIMATION
// ======================================================

let last=
    performance.now();

let sendTimer=0;


function animate(time){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(
            (time-last)/1000,
            .05
        );

    last=time;


    movePlayer(dt);

    updateCamera();

    sendTimer+=dt;


    if(
        sendTimer>.05
    ){

        sendTimer=0;

        sendState();

    }


    checkMonster();

    dangerEffect();


    if(
        abilityCooldown>0
    ){

        abilityCooldown-=dt;

    }


    document.getElementById(
        "status"
    ).textContent=

        isMonster
        ?"👹 JAGD – FINDE DIE GEJAGTEN"
        :"👤 ÜBERLEBE – DAS MONSTER IST IRGENDWO HIER";


    renderer.render(
        scene,
        camera
    );

}


window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


// ======================================================
// START MULTIPLAYER
// ======================================================

startPeer();

animate(
    performance.now()
);

</script>
