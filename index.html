<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>HORROR WORLD</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;

    background:
        radial-gradient(
            circle at center,
            #172018 0%,
            #070907 30%,
            #010201 75%,
            #000 100%
        );
}

#menuBox{
    width:min(600px,90vw);
}

#menu h1{
    margin:0;

    font-size:clamp(42px,8vw,82px);

    letter-spacing:12px;

    text-shadow:
        0 0 10px #aaa,
        0 0 35px #182018,
        0 0 80px #000;
}

#menu p{
    opacity:.65;
    line-height:1.6;
}

#connection{
    margin-top:30px;
}

#startButton{
    margin-top:20px;

    padding:16px 42px;

    background:#111611;
    color:#eee;

    border:1px solid #566056;

    border-radius:5px;

    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

#startButton:hover{
    background:#252d25;
    box-shadow:0 0 25px #202820;
}

#hud{
    position:fixed;

    top:15px;
    left:15px;

    z-index:100;

    padding:12px 15px;

    color:#ddd;

    background:rgba(0,0,0,.65);

    border:1px solid rgba(255,255,255,.08);

    border-radius:7px;

    font-size:13px;

    line-height:1.6;

    pointer-events:none;
}

#role{
    position:fixed;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    padding:10px 20px;

    color:white;

    background:rgba(0,0,0,.75);

    border-radius:20px;

    font-weight:bold;

    pointer-events:none;
}

#status{
    position:fixed;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    padding:9px 18px;

    color:#ddd;

    background:rgba(0,0,0,.72);

    border-radius:20px;

    pointer-events:none;
}

#flashlight{
    position:fixed;

    right:15px;
    bottom:15px;

    z-index:100;

    padding:9px 13px;

    color:#ddd;

    background:rgba(0,0,0,.7);

    border-radius:7px;

    pointer-events:none;
}

#crosshair{
    position:fixed;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px black;

    z-index:90;

    pointer-events:none;
}

#vignette{
    position:fixed;

    inset:0;

    z-index:80;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.25) 60%,
            rgba(0,0,0,.92) 100%
        );
}

#danger{
    position:fixed;

    inset:0;

    z-index:81;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            transparent 30%,
            rgba(110,0,0,.55)
        );

    transition:opacity:.1s;
}

#flashScreen{
    position:fixed;

    inset:0;

    z-index:500;

    background:white;

    opacity:0;

    pointer-events:none;
}

#jumpscare{
    position:fixed;

    inset:0;

    z-index:700;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle,
            rgba(30,0,0,.75),
            rgba(0,0,0,.98)
        );

    opacity:0;

    pointer-events:none;
}

#jumpscareMonster{
    width:260px;
    height:500px;

    position:relative;

    transform:scale(.35);

    transition:.12s;
}

.jsHead{
    position:absolute;

    left:50%;
    top:50px;

    transform:translateX(-50%);

    width:100px;
    height:120px;

    border-radius:50%;

    background:#ddd;

    box-shadow:
        0 0 30px #000;
}

.jsBody{
    position:absolute;

    left:50%;
    top:150px;

    transform:translateX(-50%);

    width:100px;
    height:250px;

    border-radius:45px 45px 15px 15px;

    background:#020202;
}

.jsArm{
    position:absolute;

    top:165px;

    width:25px;
    height:300px;

    border-radius:20px;

    background:#020202;
}

.jsArm.left{
    left:45px;
    transform:rotate(15deg);
}

.jsArm.right{
    right:45px;
    transform:rotate(-15deg);
}

.jsLeg{
    position:absolute;

    top:370px;

    width:30px;
    height:190px;

    border-radius:20px;

    background:#010101;
}

.jsLeg.left{
    left:95px;
    transform:rotate(8deg);
}

.jsLeg.right{
    right:95px;
    transform:rotate(-8deg);
}

#dead{
    position:fixed;

    inset:0;

    z-index:900;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    color:white;

    background:
        radial-gradient(
            circle,
            #130000,
            #000 70%
        );

    text-align:center;
}

#dead h1{
    font-size:clamp(38px,7vw,75px);

    letter-spacing:8px;

    margin:0;

    text-shadow:
        0 0 20px #600;
}

#dead p{
    opacity:.6;
}

</style>
</head>

/* =========================================================

========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================

const connection =

    );

const role =

        "role"
    );

const status =

    );

const playerCount =

    );


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x010201
    );


scene.fog =
    new THREE.FogExp2(

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

    );


camera.rotation.order =

/* =========================================================
   RENDERER
========================================================= */

const renderer =

    });


renderer.setSize(

);


renderer.setPixelRatio(

        devicePixelRatio,

    )
);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0x313c44,
        0x030503,
        .22
    )
);


const moon =
    new THREE.DirectionalLight(
        0x647487,
        .75
    );


moon.position.set(
    -50,
    80,
    -40
);


moon.castShadow =
    true;


moon.shadow.mapSize.width =
    2048;


moon.shadow.mapSize.height =
    2048;


scene.add(
    moon
);


/* =========================================================
   GROUND
========================================================= */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            240,
            240
        ),

        new THREE.MeshStandardMaterial({
            color:0x0b100c,
            roughness:1
        })

    );


ground.rotation.x =
    -Math.PI / 2;


ground.receiveShadow =
    true;


scene.add(
    ground
);


/* =========================================================
   OBSTACLES
========================================================= */

const obstacles = [];


function createWall(
    x,
    y,
    z,
    w,
    h,
    d,
    color=0x272a27
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                w,
                h,
                d
            ),

            new THREE.MeshStandardMaterial({

                color,

                roughness:1

            })

        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );


    obstacles.push(
        mesh
    );


    return mesh;

}


/* =========================================================
   HOUSES
========================================================= */

function createHouse(
    x,
    z,
    scale=1
){

    const width =
        15 * scale;

    const depth =
        13 * scale;

    const height =
        7 * scale;


    createWall(
        x,
        height/2,
        z-depth/2,
        width,
        height,
        .5*scale
    );


    createWall(
        x-width/2,
        height/2,
        z,
        .5*scale,
        height,
        depth
    );


    createWall(
        x+width/2,
        height/2,
        z,
        .5*scale,
        height,
        depth
    );


    /*
     * Vorderseite mit Türöffnung
     */

    createWall(
        x-width*.35,
        height/2,
        z+depth/2,
        width*.30,
        height,
        .5*scale
    );


    createWall(
        x+width*.35,
        height/2,
        z+depth/2,
        width*.30,
        height,
        .5*scale
    );


    /*
     * Dach
     */

    const roof =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                width*.72,
                5*scale,
                4
            ),

            new THREE.MeshStandardMaterial({
                color:0x090a09,
                roughness:1
            })

        );


    roof.position.set(
        x,
        height+2.5*scale,
        z
    );


    roof.rotation.y =
        Math.PI/4;


    roof.castShadow =
        true;


    scene.add(
        roof
    );


    /*
     * Fenster
     */

    for(
        const side of [-1,1]
    ){

        const window =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    2*scale,
                    1.5*scale,
                    .08
                ),

                new THREE.MeshStandardMaterial({

                    color:0x30372b,

                    emissive:0x171d12,

                    emissiveIntensity:.8

                })

            );


        window.position.set(

            x+
            side*width*.27,

            height*.55,

            z+
            depth/2+.3

        );


        scene.add(
            window
        );

    }

}


createHouse(
    25,
    -25,
    1.6
);


createHouse(
    -30,
    -40,
    1.4
);


createHouse(
    38,
    30,
    1.5
);


createHouse(
    -42,
    38,
    1.3
);


createHouse(
    0,
    -65,
    1.2
);


/* =========================================================
   TREES
========================================================= */

function createTree(
    x,
    z,
    scale=1
){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .45*scale,
                .65*scale,
                5*scale,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x211812,
                roughness:1
            })

        );


    trunk.position.set(
        x,
        2.5*scale,
        z
    );


    trunk.castShadow =
        true;


    scene.add(
        trunk
    );


    obstacles.push(
        trunk
    );


    for(
        let i=0;
        i<3;
        i++
    ){

        const branches =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    (3.2-i*.65)*scale,
                    4.5*scale,
                    7
                ),

                new THREE.MeshStandardMaterial({
                    color:0x071008,
                    roughness:1
                })

            );


        branches.position.set(

            x,

            5.2*scale+
            i*2.1*scale,

            z

        );


        branches.castShadow =
            true;


        scene.add(
            branches
        );

    }

}


for(
    let i=0;
    i<180;
    i++
){

    const side =
        Math.random()<.5
        ?-1
        :1;


    const x =
        side*
        (
            48+
            Math.random()*70
        );


    const z =
        -110+
        Math.random()*220;


    createTree(
        x,
        z,
        .7+
        Math.random()*.9
    );

}


/* =========================================================
   GRAVES
========================================================= */

function createGrave(
    x,
    z,
    rotation
){

    const grave =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .9,
                1.4,
                .25
            ),

                roughness:1
            })

    grave.position.set(

    );


    grave.rotation.y =

    grave.castShadow =
        true;


    scene.add(
        grave
    );


    obstacles.push(

    );

}


for(
    let i=0;
    i<55;
    i++

    createGrave(

        -58+
        Math.random()*28,

        -5+
        Math.random()*55,

    );

}


/* =========================================================
   LAMPEN / KERZEN
========================================================= */

function candle(
    x,
    z
){

    const flame =
        new THREE.PointLight(
            0xff8c38,
            2,
            7
        );


    flame.position.set(
        x,
        1,
        z
    );


    scene.add(

    );


    const holder =
        new THREE.Mesh(

            new THREE.CylinderGeometry(

                .12,
                .65,

            new THREE.MeshStandardMaterial({
                color:0xbcb39b

    holder.position.set(
        x,
        .35,
        z
    );


    scene.add(
        holder
    );

}


for(
    let i=0;
    i<30;
    i++
){

    candle(

        -48+

}


/* =========================================================
   FLASHLIGHT

let flashlightOn =

const flashlight =

   PLAYER
========================================================= */

const player = {

    position:

    grounded:true,

    height:1.8,

    radius:.35,

    walkSpeed:6,

    sprintSpeed:10,

/* =========================================================
   SPAWN
========================================================= */

const spawnPoints = [

    new THREE.Vector3(
        -8,
        1,
        8
    ),

    new THREE.Vector3(
        55,
        1,
        -45
    ),

    new THREE.Vector3(

    ),

player.position.copy(

/* =========================================================
   NETWORK
========================================================= */

let uid =
    null;


let isMonster =
    false;


let currentMonsterId =
    null;


let connected =
    false;


const networkPlayers =
    {};


const remoteMeshes =
    {};


let alreadyDead =

let catchCooldown =

/* =========================================================
   CREATE HUMAN
========================================================= */

function createHuman(){

    const group =
        new THREE.Group();


    const skin =
        new THREE.MeshStandardMaterial({
            color:0xb58f76,
            roughness:.9
        });


    const clothes =
        new THREE.MeshStandardMaterial({
            color:0x3c4851,
            roughness:1
        });


    const pants =
        new THREE.MeshStandardMaterial({
            color:0x14171a,
            roughness:1
        });


    /*
     * Körper
     */

    const body =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .30,
                .75,
                8,
                12
            ),

            clothes

        );


    body.position.y =
        1.0;


    body.castShadow =
        true;


    group.add(
        body
    );


    /*
     * Kopf
     */

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .27,
                16,
                16
            ),

            skin

        );


    head.position.y =
        1.75;


    head.castShadow =
        true;


    group.add(
        head
    );


    /*
     * Arme
     */

    for(
        const side of [-1,1]
    ){

        const arm =
            new THREE.Mesh(

                new THREE.CapsuleGeometry(
                    .095,
                    .55,
                    6,
                    8
                ),

                clothes

            );


        arm.position.set(
            side*.38,
            1.0,
            0
        );


        arm.rotation.z =
            side*.12;


        arm.castShadow =
            true;


        group.add(
            arm
        );

    }


    /*
     * Beine
     */

    for(
        const side of [-1,1]
    ){

        const leg =
            new THREE.Mesh(

                new THREE.CapsuleGeometry(
                    .11,
                    .65,
                    6,
                    8
                ),

                pants

            );


        leg.position.set(
            side*.15,
            .2,
            0
        );


        leg.castShadow =
            true;


        group.add(
            leg
        );

    }


    return group;

}


/* =========================================================
   CREATE SPIDER MONSTER
========================================================= */

function createSpiderMonster(){

    const group =
        new THREE.Group();


    /*
     * Körper
     */

    const black =
        new THREE.MeshStandardMaterial({

            color:0x020202,

            roughness:1

        });


    const body =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .46,
                1.55,
                10,
                14
            ),

            black

        );


    body.position.y =
        1.45;


    body.castShadow =
        true;


    group.add(
        body
    );


    /*
     * gesichtsloser Kopf
     */

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .39,
                20,
                20
            ),

            new THREE.MeshStandardMaterial({

                color:0xd6d6d0,

                roughness:1

            })

        );


    head.scale.set(
        .95,
        1.2,
        .65
    );


    head.position.y =
        2.65;


    head.castShadow =
        true;


    group.add(
        head
    );


    /*
     * Schwarze Augenhöhlen
     */

    for(
        const side of [-1,1]
    ){

        const eye =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    .075,
                    10,
                    10
                ),

                new THREE.MeshBasicMaterial({
                    color:0x000000
                })

            );


        eye.position.set(
            side*.13,
            2.7,
            -.31
        );


        group.add(
            eye
        );

    }


    /*
     * Spinnenartige lange Arme
     */

    for(
        const side of [-1,1]
    ){

        for(
            let i=0;
            i<2;
            i++
        ){

            const arm =
                new THREE.Mesh(

                    new THREE.CapsuleGeometry(
                        .12,
                        1.45,
                        8,
                        10
                    ),

                    black

                );


            arm.position.set(

                side*
                (
                    .62+
                    i*.15
                ),

                1.45-
                i*.25,

                .05+

                i*.2

            );


            arm.rotation.z =
                side*
                (
                    .15+
                    i*.25
                );


            arm.rotation.x =
                i*.18;


            arm.castShadow =
                true;


            group.add(
                arm
            );

        }

    }


    /*
     * Lange Beine
     */

    for(
        const side of [-1,1]
    ){

        for(
            let i=0;
            i<2;
            i++
        ){

            const leg =
                new THREE.Mesh(

                    new THREE.CapsuleGeometry(
                        .15,
                        1.6,
                        8,
                        10
                    ),

                    black

                );


            leg.position.set(

                side*
                (
                    .22+
                    i*.2
                ),

                .25,

                .05+
                i*.25

            );


            leg.rotation.z =
                side*
                (
                    .05+
                    i*.25
                );


            leg.rotation.x =
                i*.25;


            leg.castShadow =
                true;


            group.add(
                leg
            );

        }

    }


    /*
     * Monster deutlich größer
     */

    group.scale.set(
        1.15,
        1.35,
        1.15
    );


    return group;

}

function createRemote(
    data
){

    if(
        remoteMeshes[data.id]
    )
        return;


    const group =
        data.monster
        ?createSpiderMonster()
        :createHuman();


    group.position.set(

        data.x || 0,

        (data.y || 1)-1,

        data.z || 0

    );


    group.rotation.y =
        data.yaw || 0;


    group.userData.animTime =
        Math.random()*10;


    group.userData.monster =
        !!data.monster;


    scene.add(
        group
    );


    remoteMeshes[data.id] =
        group;

}


/* =========================================================
   UPDATE REMOTE
========================================================= */

function updateRemote(
    data
){

    if(
        data.id === uid
    )
        return;


    createRemote(
        data
    );


    const mesh =
        remoteMeshes[data.id];


    mesh.userData.targetX =
        data.x || 0;


    mesh.userData.targetY =
        (data.y || 1)-1;


    mesh.userData.targetZ =
        data.z || 0;


    mesh.userData.targetYaw =
        data.yaw || 0;


    mesh.userData.monster =
        !!data.monster;

}


/* =========================================================
   REMOTE ANIMATION
========================================================= */

function animateRemote(
    mesh,
    dt
){

    if(
        mesh.userData.targetX ===
        undefined
    )
        return;


    const dx =
        mesh.userData.targetX -
        mesh.position.x;


    const dz =
        mesh.userData.targetZ -
        mesh.position.z;


    const moving =
        Math.sqrt(
            dx*dx+
            dz*dz
        ) > .02;


    mesh.position.x +=
        dx*.25;


    mesh.position.y +=
        (
            mesh.userData.targetY -
            mesh.position.y
        )*.25;


    mesh.position.z +=
        dz*.25;


    let rotDiff =
        mesh.userData.targetYaw -
        mesh.rotation.y;


    rotDiff =
        Math.atan2(
            Math.sin(rotDiff),
            Math.cos(rotDiff)
        );


    mesh.rotation.y +=
        rotDiff*.25;


    /*
     * Animation
     */

    mesh.userData.animTime +=
        dt*8;


    const t =
        mesh.userData.animTime;


    if(
        moving
    ){

        const swing =
            Math.sin(t)*.5;


        if(
            mesh.userData.monster
        ){

            /*
             * Monster bewegt sich
             * unnatürlich.
             */

            mesh.rotation.z =
                Math.sin(t*.55)*.10;


            mesh.rotation.x =
                Math.sin(t*.35)*.07;


            for(
                let i=2;
                i<mesh.children.length;
                i++
            ){

                if(
                    mesh.children[i]
                ){

                    mesh.children[i]
                        .rotation.x +=
                        Math.sin(
                            t+i
                        )*.01;

                }

            }

        }else{

            /*
             * Menschliche Laufbewegung
             */

            for(
                let i=2;
                i<4;
                i++
            ){

                if(
                    mesh.children[i]
                ){

                    mesh.children[i]
                        .rotation.x =
                        swing;

                }

            }


            for(
                let i=4;
                i<6;
                i++
            ){

                if(
                    mesh.children[i]
                ){

                    mesh.children[i]
                        .rotation.x =
                        -swing;

                }

            }

        }

    }

}

/* =========================================================
   COLLISION
========================================================= */

function playerCollides(
    position
){

    const playerBox =
        new THREE.Box3();


    playerBox.setFromCenterAndSize(

        new THREE.Vector3(
            position.x,
            position.y,
            position.z
        ),

        new THREE.Vector3(
            player.radius*2,
            player.height,
            player.radius*2
        )

    );


    const obstacleBox =
        new THREE.Box3();


    for(
        const obstacle of
        obstacles
    ){

        obstacleBox.setFromObject(
            obstacle
        );


        if(
            playerBox.intersectsBox(
                obstacleBox
            )
        ){

            return true;

        }

    }


    return false;

}

   MOUSE

let yaw =
    0;

let pitch =
    0;


document.addEventListener(
    "mousemove",
    event => {

        if(
            document.pointerLockElement !==
            renderer.domElement
        )
            return;


        yaw -=
            event.movementX*.002;


        pitch -=
            event.movementY*.002;


        pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );

    }
);

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updateMovement(
    dt
){

    const direction =
        new THREE.Vector3();


    if(keys.KeyW)
        direction.z -= 1;

    if(keys.KeyS)
        direction.z += 1;

    if(keys.KeyA)
        direction.x -= 1;

    if(keys.KeyD)
        direction.x += 1;


    const moving =
        direction.length() > 0;


    if(
        moving
    ){

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        const sprint =
            keys.ShiftLeft ||
            keys.ShiftRight;


        const speed =
            sprint
            ?player.sprintSpeed
            :player.walkSpeed;


        /*
         * X
         */

        const nextX =
            player.position.clone();


        nextX.x +=
            direction.x*
            speed*
            dt;


        if(
            !playerCollides(
                nextX
            )
        ){

            player.position.x =
                nextX.x;

        }


        /*
         * Z
         */

        const nextZ =
            player.position.clone();


        nextZ.z +=
            direction.z*
            speed*
            dt;


        if(
            !playerCollides(
                nextZ
            )
        ){

            player.position.z =
                nextZ.z;

        }

    }


    /*
     * Gravitation
     */

    player.velocityY -=
        19.6*dt;


    player.position.y +=
        player.velocityY*dt;


    if(
        player.position.y <= 1
    ){

        player.position.y =
            1;

        player.velocityY =
            0;

        player.grounded =
            true;

    }


    /*
     * Kamera-/Bewegungsanimation
     */

    if(
        moving &&
        player.grounded
    ){

        player.animTime +=
            dt*10;

        camera.position.y +=
            Math.sin(
                player.animTime
            )*.025;

    }

}


/* =========================================================
   FLASH PROJECTILE
========================================================= */

const flashProjectiles =
    [];


function createFlashProjectile(){

    if(
        isMonster
    )
        return;


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    direction.normalize();


    const mesh =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .28,
                16,
                16
            ),

            new THREE.MeshStandardMaterial({

                color:0xf5f5df,

                emissive:0xffffff,

                emissiveIntensity:2

            })

        );


    mesh.position.copy(
        camera.position
    );


    mesh.position.add(
        direction.multiplyScalar(1.3)
    );


    mesh.castShadow =
        true;


    scene.add(
        mesh
    );


    flashProjectiles.push({

        mesh,

        velocity:
            direction.multiplyScalar(
                12
            ),

        bounces:0,

        life:8

    });

}


/* =========================================================
   FLASH PHYSICS
========================================================= */

function updateFlashProjectiles(
    dt
){

    for(
        let i=
            flashProjectiles.length-1;

        i>=0;

        i--
    ){

        const flash =
            flashProjectiles[i];


        flash.life -=
            dt;


        /*
         * Gravitation
         */

        flash.velocity.y -=
            8.5*dt;


        const oldPosition =
            flash.mesh.position.clone();


        flash.mesh.position.add(
            flash.velocity.clone()
                .multiplyScalar(dt)
        );


        /*
         * Boden
         */

        if(
            flash.mesh.position.y <= .3
        ){

            flash.mesh.position.y =
                .3;


            bounceFlash(
                flash,
                new THREE.Vector3(
                    0,
                    1,
                    0
                )
            );

        }


        /*
         * Weltgrenze
         */

        if(
            Math.abs(
                flash.mesh.position.x
            ) > 115 ||
            Math.abs(
                flash.mesh.position.z
            ) > 115
        ){

            explodeFlash(
                flash.mesh.position.clone()
            );


            removeFlash(
                i
            );


            continue;

        }


        /*
         * Hindernisse
         */

        let hit =
            false;


        const sphere =
            new THREE.Sphere(
                flash.mesh.position,
                .28
            );


        for(
            const obstacle of
            obstacles
        ){

            const box =
                new THREE.Box3()
                    .setFromObject(
                        obstacle
                    );


            if(
                box.intersectsSphere(
                    sphere
                )
            ){

                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );


                const difference =
                    flash.mesh.position
                        .clone()
                        .sub(center);


                let normal;


                if(
                    Math.abs(
                        difference.x
                    ) >
                    Math.abs(
                        difference.z
                    )
                ){

                    normal =
                        new THREE.Vector3(
                            Math.sign(
                                difference.x
                            ),
                            0,
                            0
                        );

                }else{

                    normal =
                        new THREE.Vector3(
                            0,
                            0,
                            Math.sign(
                                difference.z
                            )
                        );

                }


                bounceFlash(
                    flash,
                    normal
                );


                hit =
                    true;


                break;

            }

        }


        if(
            flash.bounces >= 2
        ){

            explodeFlash(
                flash.mesh.position.clone()
            );


            removeFlash(
                i
            );


            continue;

        }


        if(
            flash.life <= 0
        ){

            removeFlash(
                i
            );

        }

    }

}


/* =========================================================
   BOUNCE
========================================================= */

function bounceFlash(
    flash,
    normal
){

    if(
        flash.bounces >= 2
    )
        return;


    flash.bounces++;


    /*
     * Reflexion
     */

    const v =
        flash.velocity;


    const reflected =
        v.clone()
            .sub(
                normal.clone()
                    .multiplyScalar(
                        2*v.dot(normal)
                    )
            );


    flash.velocity =
        reflected.multiplyScalar(
            .72
        );


    /*
     * Kleiner Partikeleffekt
     */

    createParticles(
        flash.mesh.position.clone(),
        12
    );


    /*
     * Beim zweiten Aufprall
     * explodiert sie sofort.
     */

    if(
        flash.bounces >= 2
    ){

        explodeFlash(
            flash.mesh.position.clone()
        );

    }

}

/* =========================================================
   PARTICLES
========================================================= */

const particles =
    [];


function createParticles(
    position,
    amount=20
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const mesh =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    .025+
                    Math.random()*.04,
                    6,
                    6
                ),

                new THREE.MeshBasicMaterial({

                    color:
                        Math.random()>.35
                        ?0xffffff
                        :0xffe9a8

                })

            );


        mesh.position.copy(
            position
        );


        scene.add(
            mesh
        );


        particles.push({

            mesh,

            velocity:
                new THREE.Vector3(

                    (Math.random()-.5)*5,

                    Math.random()*5,

                    (Math.random()-.5)*5

                ),

            life:
                .3+
                Math.random()*.5

        });

    }

}


function updateParticles(
    dt
){

    for(
        let i=
            particles.length-1;

        i>=0;

        i--
    ){

        const particle =
            particles[i];


        particle.life -=
            dt;


        particle.velocity.y -=
            7*dt;


        particle.mesh.position.add(

            particle.velocity
                .clone()
                .multiplyScalar(dt)

        );


        if(
            particle.life <= 0
        ){

            scene.remove(
                particle.mesh
            );


            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   FLASH EXPLOSION
========================================================= */

function explodeFlash(
    position
){

    /*
     * lokaler Blitz
     */

    const light =
        new THREE.PointLight(
            0xffffff,
            150,
            55
        );


    light.position.copy(
        position
    );


    scene.add(
        light
    );


    createParticles(
        position,
        60
    );


    /*
     * Bildschirmflash
     */

    flashScreen(
        position
    );


    /*
     * Monster bekommt über Firebase
     * denselben Flash.
     */

    if(
        !isMonster &&
        currentMonsterId
    ){

        sendEvent(
            currentMonsterId,
            {

                type:"flash",

                x:position.x,
                y:position.y,
                z:position.z

            }
        );

    }


    /*
     * Licht ausblenden
     */

    let strength =
        1;


    const fade =
        setInterval(
            () => {

                strength *= .72;

                light.intensity =
                    150*
                    strength;


                if(
                    strength < .02
                ){

                    clearInterval(
                        fade
                    );


                    scene.remove(
                        light
                    );

                }

            },
            35
        );

}


/* =========================================================
   SCREEN FLASH
========================================================= */

function flashScreen(
    position
){

    const distance =
        camera.position.distanceTo(
            position
        );


    const maxDistance =
        55;


    if(
        distance >
        maxDistance
    )
        return;


    let strength =
        1-
        distance/
        maxDistance;


    strength =
        Math.pow(
            Math.max(
                0,
                strength
            ),
            .5
        );


    if(
        isMonster
    ){

        /*
         * Monster sieht ihn
         * deutlich heller.
         */

        strength *=
            1.9;

    }


    const screen =
        document.getElementById(
            "flashScreen"
        );


    screen.style.opacity =
        Math.min(
            1,
            strength
        );


    setTimeout(
        () => {

            screen.style.opacity =
                Math.min(
                    .75,
                    strength*.5
                );

        },
        100
    );


    setTimeout(
        () => {

            screen.style.opacity =
                0;

        },
        650
    );

}


/* =========================================================
   ABILITY
========================================================= */

let abilityCooldown =
    0;


function useAbility(){

    if(
        abilityCooldown > 0
    )
        return;


    abilityCooldown =
        isMonster
        ?7
        :4;


    /*
     * MONSTER
     */

    if(
        isMonster
    ){

        let target =
            null;


        let closest =
            Infinity;


        for(
            const id in
            networkPlayers
        ){

            const p =
                networkPlayers[id];


            if(
                !p ||
                p.monster
            )
                continue;


            const distance =
                player.position.distanceTo(

                    new THREE.Vector3(
                        p.x,
                        p.y,
                        p.z
                    )

                );


            if(
                distance <
                closest
            ){

                closest =
                    distance;

                target =
                    p;

            }

        }


        if(
            target &&
            closest < 25
        ){

            sendEvent(
                target.id,
                {
                    type:
                        "jumpscare"
                }
            );

        }

    }

    /*
     * GEJAGTER
     */

    else{

        createFlashProjectile();

    }

}

function updateDanger(){

    if(
        isMonster
    ){

        document.getElementById(
            "danger"
        ).style.opacity =
            0;

        return;

    }


    let nearest =
        Infinity;


    for(

    ){

            !p ||
            !p.monster
        )

        const distance =

            0;

    )

/* =========================================================
   FIREBASE EVENT SENDEN
========================================================= */

async function sendEvent(
    targetId,
    data
){

    if(
        !targetId
    )
        return;


    const targetEvents =
        ref(
            db,
            lobbyPath+
            "/events/"+
            targetId
        );


    const eventRef =
        push(
            targetEvents
        );


    await set(
        eventRef,
        {

            ...data,

            from:
                uid,

            time:
                Date.now()

        }
    );

}


/* =========================================================
   FIREBASE EVENTS EMPFANGEN
========================================================= */

function setupEvents(){

    onChildAdded(
        ref(
            db,
            lobbyPath+
            "/events/"+
            uid
        ),

        async snapshot => {

            const event =
                snapshot.val();


            if(
                !event
            )
                return;


            /*
             * alte Events ignorieren
             */

            if(
                Date.now()-
                (event.time || Date.now())
                >10000
            ){

                await remove(
                    snapshot.ref
                );

                return;

            }


            if(
                event.type ===
                "flash"
            ){

                const position =
                    new THREE.Vector3(
                        event.x,
                        event.y,
                        event.z
                    );


                /*
                 * Monster sieht
                 * den Flash sehr hell.
                 */

                explodeRemoteFlash(
                    position
                );

            }


            if(
                event.type ===
                "jumpscare"
            ){

                if(
                    !isMonster
                ){

                    showJumpscare();

                }

            }


            if(
                event.type ===
                "dead"
            ){

                loseGame();

            }


            await remove(
                snapshot.ref
            );

        }
    );

}


/* =========================================================
   REMOTE FLASH
========================================================= */

function explodeRemoteFlash(
    position
){

    const light =
        new THREE.PointLight(
            0xffffff,
            240,
            75
        );


    light.position.copy(
        position
    );


    scene.add(
        light
    );


    createParticles(
        position,
        90
    );


    flashScreen(
        position
    );


    let power =
        1;


    const fade =
        setInterval(
            () => {

                power *= .72;


                light.intensity =
                    240*
                    power;


                if(
                    power < .02
                ){

                    clearInterval(
                        fade
                    );


                    scene.remove(
                        light
                    );

                }

            },
            35
        );

}


/* =========================================================
   LOSE
========================================================= */

function loseGame(){

    if(
        alreadyDead
    )
        return;


    alreadyDead =
        true;


    document.exitPointerLock();


    document.getElementById(
        "dead"
    ).style.display =
        "flex";

}


/* =========================================================
   ROLE
========================================================= */

function updateRole(){

    role.textContent =
        isMonster
        ?"👹 DU BIST DAS MONSTER"
        :"👤 DU WIRST GEJAGT";

}


/* =========================================================
   CONNECT
========================================================= */

async function connectPlayer(){

    const myRef =
        ref(
            db,
            playersPath+
            "/"+
            uid
        );


    /*
     * beim Verlassen löschen
     */

    await onDisconnect(
        myRef
    ).remove();


    /*
     * Monster bestimmen
     */

    const result =
        await runTransaction(
            monsterRef,
            current => {

                if(
                    current === null
                ){

                    return uid;

                }


                return current;

            }
        );


    currentMonsterId =
        result.snapshot.val();


    isMonster =
        currentMonsterId === uid;


    /*
     * Falls wir Monster sind,
     * monsterId beim Disconnect löschen.
     */

    if(
        isMonster
    ){

        await onDisconnect(
            monsterRef
        ).remove();

    }


    updateRole();


    /*
     * Spieler zufällig positionieren
     */

    const mySpawn =
        spawnPoints[
            spawnIndex
        ];


    player.position.copy(
        mySpawn
    );


    await set(
        myRef,
        {

            id:uid,

            x:
                player.position.x,

            y:
                player.position.y,

            z:
                player.position.z,

            yaw:0,

            monster:
                isMonster,

            dead:false,

            joinedAt:
                Date.now()

        }
    );


    connected =
        true;


    connection.textContent =
        "✓ Multiplayer verbunden";


    setupEvents();


    /*
     * Spieler beobachten
     */

    onValue(
        playersRef,
        snapshot => {

            const data =
                snapshot.val() || {};


            const ids =
                Object.keys(data);


            playerCount.textContent =
                ids.length;


            for(
                const id of ids
            ){

                if(
                    id === uid
                )
                    continue;


                networkPlayers[id] =
                    data[id];


                updateRemote(
                    data[id]
                );

            }


            for(
                const id in
                networkPlayers
            ){

                if(
                    !data[id]
                ){

                    removeRemote(
                        id
                    );


                    delete networkPlayers[id];

                }

            }


            if(
                ids.length < 2
            ){

                status.textContent =
                    "Warte auf den zweiten Spieler...";

            }else{

                status.textContent =
                    isMonster
                    ?"👹 Jage den anderen Spieler!"
                    :"🏃 Laufe vor dem Monster weg!";

            }

        }
    );


    /*
     * Monster-ID beobachten
     */

    onValue(
        monsterRef,
        snapshot => {

            currentMonsterId =
                snapshot.val();


            /*
             * Wenn Monster verschwunden ist,
             * darf ein verbleibender Spieler
             * es übernehmen.
             */

            if(
                !currentMonsterId
            ){

                runTransaction(
                    monsterRef,
                    current => {

                        if(
                            current === null
                        )
                            return uid;

                        return current;

                    }
                );

            }


            const newMonster =
                currentMonsterId === uid;


            if(
                newMonster !==
                isMonster
            ){

                isMonster =
                    newMonster;


                updateRole();

            }

        }
    );


    /*
     * Position regelmäßig senden
     */

    setInterval(
        () => {

            if(
                !connected ||
                !uid
            )
                return;


            update(
                myRef,
                {

                    x:
                        player.position.x,

                    y:
                        player.position.y,

                    z:
                        player.position.z,

                    yaw:
                        yaw,

                    monster:
                        isMonster

                }
            ).catch(
                console.error
            );

        },
        50
    );

}

   AUTH

/* =========================================================
   BLOOD-RAIN / RED RAIN
========================================================= */

const rainDrops = [];


function createRainDrop(){

    const geometry =
        new THREE.CylinderGeometry(
            .012,
            .025,
            .55,
            5
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:0x5b0707,

            transparent:true,

            opacity:.65

        });


    const drop =
        new THREE.Mesh(
            geometry,
            material
        );


    drop.position.set(

        camera.position.x+
        (Math.random()-.5)*70,

        camera.position.y+
        25+
        Math.random()*25,

        camera.position.z+
        (Math.random()-.5)*70

    );


    scene.add(
        drop
    );


    rainDrops.push({

        mesh:drop,

        speed:
            10+
            Math.random()*15,

        life:
            3+
            Math.random()*4

    });

}


let rainTimer =
    0;


let raining =
    false;


let nextRain =
    15+
    Math.random()*25;


function updateRain(
    dt
){

    rainTimer +=
        dt;


    if(
        !raining &&
        rainTimer > nextRain
    ){

        raining =
            true;

        rainTimer =
            0;

        nextRain =
            20+
            Math.random()*35;

    }


    /*
     * Regen
     */

    if(
        raining
    ){

        for(
            let i=0;
            i<5;
            i++
        ){

            createRainDrop();

        }

        if(
            rainTimer > 5+
            Math.random()*4
        ){

            raining =
                false;

            rainTimer =
                0;

        }

    }


    /*
     * Tropfen bewegen
     */

    for(
        let i=
            rainDrops.length-1;

        i>=0;

        i--
    ){

        const drop =
            rainDrops[i];


        drop.mesh.position.y -=
            drop.speed*dt;


        drop.life -=
            dt;


        if(
            drop.mesh.position.y <
            .2 ||
            drop.life <= 0
        ){

            scene.remove(
                drop.mesh
            );


            rainDrops.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   MAIN LOOP
========================================================= */

let last =
    performance.now();


function animate(
    time
){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            (time-last)/1000,
            .05
        );


    last =
        time;


    updateMovement(
        dt
    );


    updateCamera();


    updateFlashProjectiles(
        dt
    );


    updateParticles(
        dt
    );


    updateRain(
        dt
    );


    updateDanger();


    checkMonsterCatch();


    /*
     * Cooldowns
     */

    if(
        abilityCooldown > 0
    ){

        abilityCooldown -=
            dt;

    }


    if(
        catchCooldown > 0
    ){

        catchCooldown -=
            dt;

    }


    /*
     * Remote animation
     */

    for(
        const id in
        remoteMeshes
    ){

        animateRemote(
            remoteMeshes[id],
            dt
        );

    }


    renderer.render(
        scene,
        camera
    );

}

   START BUTTON

document.getElementById(

).onclick = () => {

login();

animate(
    performance.now()
);
