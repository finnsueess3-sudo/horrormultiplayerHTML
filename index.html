/* =====================================================
   WÄNDE
===================================================== */

function wall(
    x,
    y,
    z,
    w,
    h,
    d,
    color=0x303331
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                w,
                h,
                d
            ),

            new THREE.MeshStandardMaterial({

                color:color,

                roughness:.9

            })

        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );


    obstacles.push(
        mesh
    );


    return mesh;
}


/* =====================================================
   HÄUSER
===================================================== */

function house(
    x,
    z,
    s=1
){

    const w =
        16 * s;


    const d =
        13 * s;


    const h =
        6 * s;


    wall(
        x,
        h/2,
        z-d/2,
        w,
        h,
        .5*s
    );


    wall(
        x-w/2,
        h/2,
        z,
        .5*s,
        h,
        d
    );


    wall(
        x+w/2,
        h/2,
        z,
        .5*s,
        h,
        d
    );


    wall(
        x-w*.32,
        h/2,
        z+d/2,
        w*.35,
        h,
        .5*s
    );


    wall(
        x+w*.32,
        h/2,
        z+d/2,
        w*.35,
        h,
        .5*s
    );


    const roof =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                w*.75,
                5*s,
                4
            ),

            new THREE.MeshStandardMaterial({

                color:0x151615,

                roughness:1

            })

        );


    roof.position.set(
        x,
        h+2.5*s,
        z
    );


    roof.rotation.y =
        Math.PI / 4;


    roof.castShadow =
        true;


    scene.add(
        roof
    );


    for(
        const wx of
        [-w*.3,w*.3]
    ){

        const windowMesh =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    2*s,
                    1.5*s,
                    .1
                ),

                new THREE.MeshStandardMaterial({

                    color:0x5f704e,

                    emissive:0x243018,

                    emissiveIntensity:1

                })

            );


        windowMesh.position.set(
            x+wx,
            h*.6,
            z+d/2+.3
        );


        scene.add(
            windowMesh
        );

    }

}

   LOCAL PLAYER
===================================================== */

const player = {

    position:
        new THREE.Vector3(
            0,
            1,
            10

    velocityY:0,

    height:1.8,

    radius:.38,

/* =====================================================
   NETWORK
===================================================== */

let uid =
    null;


let isMonster =
    false;


let connected =
    false;


const networkPlayers =
    {};


const remoteMeshes =
    {};


/* =====================================================
   AUTH
===================================================== */

async function login(){

    connectionText.textContent =
        "Firebase wird verbunden...";


    try{

        await signInAnonymously(
            auth
        );

    }catch(error){

        console.error(
            "Firebase Login:",
            error
        );


        connectionText.textContent =
            "Firebase Login Fehler";


        statusText.textContent =
            error.message;

    }

}


onAuthStateChanged(
    auth,
    async user => {

        if(!user)
            return;


        uid =
            user.uid;


        console.log(
            "Meine UID:",
            uid
        );


        await connectPlayer();

    }
);


/* =====================================================
   PLAYER CONNECT
===================================================== */

async function connectPlayer(){

    const myRef =
        ref(
            db,
            playersPath +
            "/" +
            uid
        );


    /*
        Bei Disconnect automatisch entfernen
    */

    await onDisconnect(
        myRef
    ).remove();


    /*
        Erstes Gerät wird Monster.
        Zweites Gerät wird Gejagter.
    */

    const result =
        await runTransaction(
            monsterRef,
            current => {

                if(
                    current === null
                ){

                    return uid;

                }


                return current;

            }
        );


    const monsterId =
        result.snapshot.val();


    isMonster =
        monsterId === uid;


    updateRole();


    /*
        Spieler speichern
    */

    await set(
        myRef,
        {

            id:uid,

            x:
                player.position.x,

            y:
                player.position.y,

            z:
                player.position.z,

            yaw:0,

            monster:
                isMonster,

            joinedAt:
                Date.now()

        }
    );


    connected =
        true;


    connectionText.textContent =
        "Multiplayer verbunden";


    /*
        Spieler beobachten
    */

    onValue(
        playersRef,
        snapshot => {

            const data =
                snapshot.val() || {};


            const ids =
                Object.keys(data);


            playerCountText.textContent =
                ids.length;


            if(
                ids.length >= 2
            ){

                statusText.textContent =
                    isMonster
                    ?"👹 Finde den Gejagten!"
                    :"👤 Überlebe das Monster!";

            }else{

                statusText.textContent =
                    "Warte auf Spieler...";

            }


            /*
                Netzwerkdaten aktualisieren
            */

            for(
                const id of ids
            ){

                if(
                    id === uid
                )
                    continue;


                networkPlayers[id] =
                    data[id];


                updateRemote(
                    data[id]
                );

            }


            /*
                Alte Spieler entfernen
            */

            for(
                const id in networkPlayers
            ){

                if(
                    !data[id]
                ){

                    removeRemote(
                        id
                    );

                    delete networkPlayers[id];

                }

            }

        },

        error => {

            console.error(
                "Realtime Database:",
                error
            );


            statusText.textContent =
                "Datenbankfehler";

        }
    );


    /*
        Position senden
    */

    setInterval(
        () => {

            if(
                !uid ||
                !connected
            )
                return;


            update(
                myRef,
                {

                    x:
                        player.position.x,

                    y:
                        player.position.y,

                    z:
                        player.position.z,

                    yaw:
                        yaw,

                    monster:
                        isMonster

                }
            ).catch(
                console.error
            );

        },
        50
    );

}


/* =====================================================
   ROLE
===================================================== */

function updateRole(){

    roleText.textContent =
        isMonster
        ?"👹 DU BIST DAS MONSTER"
        :"👤 DU WIRST GEJAGT";

}


/* =====================================================
   REMOTE PLAYER ERSTELLEN
===================================================== */

function createRemote(
    data
){

    if(
        remoteMeshes[data.id]
    )
        return;


    const group =
        new THREE.Group();


    /*
        Körper
    */

    const body =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .32,
                .8,
                8,
                12
            ),

            new THREE.MeshStandardMaterial({

                color:
                    data.monster
                    ?0x180000
                    :0x334d61

            })

        );


    body.position.y =
        .85;


    body.castShadow =
        true;


    group.add(
        body
    );


    /*
        Kopf
    */

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .28,
                16,
                16
            ),

            new THREE.MeshStandardMaterial({

                color:
                    data.monster
                    ?0x260000
                    :0xb0a095

            })

        );


    head.position.y =
        1.7;


    head.castShadow =
        true;


    group.add(
        head
    );


    /*
        Monster-Augen
    */

    if(
        data.monster
    ){

        for(
            const x of
            [-.1,.1]
        ){

            const eye =
                new THREE.Mesh(

                    new THREE.SphereGeometry(
                        .055,
                        8,
                        8
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0xff0000

                    })

                );


            eye.position.set(
                x,
                1.73,
                -.25
            );


            group.add(
                eye
            );

        }

    }


    /*
        Startposition
    */

    group.position.set(

        data.x ?? 0,

        (data.y ?? 1)-1,

        data.z ?? 0

    );


    group.rotation.y =
        data.yaw ?? 0;


    scene.add(
        group
    );


    remoteMeshes[data.id] =
        group;

}


/* =====================================================
   REMOTE PLAYER UPDATE
===================================================== */

function updateRemote(
    data
){

    if(
        data.id === uid
    )
        return;


    createRemote(
        data
    );


    const mesh =
        remoteMeshes[data.id];


    /*
        Zielposition speichern.

        Die Figur wird nicht sofort
        teleportiert.
    */

    mesh.userData.targetX =
        data.x ?? 0;


    mesh.userData.targetY =
        (data.y ?? 1)-1;


    mesh.userData.targetZ =
        data.z ?? 0;


    mesh.userData.targetYaw =
        data.yaw ?? 0;


    /*
        Farbe aktualisieren
    */

    const body =
        mesh.children[0];


    const head =
        mesh.children[1];


    if(
        data.monster
    ){

        body.material.color.set(
            0x180000
        );


        head.material.color.set(
            0x260000
        );

    }else{

        body.material.color.set(
            0x334d61
        );


        head.material.color.set(
            0xb0a095
        );

    }

}


/* =====================================================
   REMOTE SMOOTH MOVEMENT
===================================================== */

function smoothRemotePlayers(){

    for(
        const id in remoteMeshes
    ){

        const mesh =
            remoteMeshes[id];


        if(
            mesh.userData.targetX ===
            undefined
        )
            continue;


        mesh.position.x +=
            (
                mesh.userData.targetX -
                mesh.position.x
            ) * .35;


        mesh.position.y +=
            (
                mesh.userData.targetY -
                mesh.position.y
            ) * .35;


        mesh.position.z +=
            (
                mesh.userData.targetZ -
                mesh.position.z
            ) * .35;


        /*
            Rotation
        */

        let target =
            mesh.userData.targetYaw;


        let difference =
            target -
            mesh.rotation.y;


        while(
            difference > Math.PI
        )
            difference -=
                Math.PI*2;


        while(
            difference < -Math.PI
        )
            difference +=
                Math.PI*2;


        mesh.rotation.y +=
            difference*.35;

    }

}


/* =====================================================
   REMOVE REMOTE
===================================================== */

function removeRemote(
    id
){

    if(
        !remoteMeshes[id]
    )
        return;


    scene.remove(
        remoteMeshes[id]
    );


    delete remoteMeshes[id];

}


/* =====================================================
   COLLISION
===================================================== */

function collides(
    pos
){

    const playerBox =
        new THREE.Box3();


    playerBox.setFromCenterAndSize(

        new THREE.Vector3(
            pos.x,
            pos.y,
            pos.z
        ),

        new THREE.Vector3(
            player.radius*2,
            player.height,
            player.radius*2
        )

    );


    const box =
        new THREE.Box3();


    for(
        const obstacle of
        obstacles
    ){

        box.setFromObject(
            obstacle
        );


        if(
            playerBox.intersectsBox(
                box
            )
        ){

            return true;

        }

    }


    return false;

}


/* =====================================================
   MOVEMENT
===================================================== */

function movePlayer(
    dt
){

    const dir =
        new THREE.Vector3();


    if(
        keys.KeyW
    )
        dir.z -= 1;


    if(
        keys.KeyS
    )
        dir.z += 1;


    if(
        keys.KeyA
    )
        dir.x -= 1;


    if(
        keys.KeyD
    )
        dir.x += 1;


    if(
        dir.length() > 0
    ){

        dir.normalize();


        dir.applyAxisAngle(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            yaw

        );


        const sprint =
            keys.ShiftLeft ||
            keys.ShiftRight;


        const speed =
            sprint
            ?player.sprintSpeed
            :player.walkSpeed;


        /*
            X
        */

        const nextX =
            player.position.clone();


        nextX.x +=
            dir.x *
            speed *
            dt;


        if(
            !collides(nextX)
        ){

            player.position.x =
                nextX.x;

        }


        /*
            Z
        */

        const nextZ =
            player.position.clone();


        nextZ.z +=
            dir.z *
            speed *
            dt;


        if(
            !collides(nextZ)
        ){

            player.position.z =
                nextZ.z;

        }

    }


    /*
        Gravitation
    */

    player.velocityY -=
        19.6 *
        dt;


    player.position.y +=
        player.velocityY *
        dt;


    if(
        player.position.y <= 1
    ){

        player.position.y =
            1;


        player.velocityY =
            0;


        player.grounded =
            true;

    }

}


/* =====================================================
   TASTEN
===================================================== */

const keys = {};


window.addEventListener(
    "keydown",
    e => {

        keys[e.code] =
            true;


        /*
            Springen
        */

        if(
            e.code === "Space" &&
            player.grounded
        ){

            player.velocityY =
                7;


            player.grounded =
                false;

        }


        /*
            Taschenlampe
        */

        if(
            e.code === "KeyF" &&
            !e.repeat
        ){

            flashlightOn =
                !flashlightOn;


            flashlight.visible =
                flashlightOn;


            document.getElementById(
                "flashlight"
            ).textContent =
                flashlightOn
                ?"🔦 Taschenlampe: AN"
                :"🔦 Taschenlampe: AUS";

        }


        /*
            Fähigkeit
        */

        if(
            e.code === "KeyQ" &&
            !e.repeat
        ){

            ability();

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[e.code] =
            false;

    }
);


/* =====================================================
   MAUS
===================================================== */

let yaw =
    0;


let pitch =
    0;


document.addEventListener(
    "mousemove",
    e => {

        if(
            document.pointerLockElement !==
            renderer.domElement
        )
            return;


        yaw -=
            e.movementX *
            .002;


        pitch -=
            e.movementY *
            .002;


        pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );

    }
);


/* =====================================================
   START
===================================================== */

document.getElementById(
    "startButton"
).onclick = () => {

    renderer.domElement
        .requestPointerLock();


    document.getElementById(
        "menu"
    ).style.display =
        "none";

};


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    camera.position.copy(
        player.position
    );


    camera.position.y +=
        .75;


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;


    flashlight.position.copy(
        camera.position
    );


    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    dir.applyQuaternion(
        camera.quaternion
    );


    flashlight.target.position.copy(
        camera.position
    );


    flashlight.target.position.add(
        dir.multiplyScalar(25)
    );

}


/* =====================================================
   MONSTER CHECK
===================================================== */

function checkMonster(){

    if(
        !isMonster
    )
        return;


    for(
        const id in networkPlayers
    ){

        const p =
            networkPlayers[id];


        if(
            !p ||
            p.monster
        )
            continue;


        const distance =
            player.position.distanceTo(

                new THREE.Vector3(
                    p.x,
                    p.y,
                    p.z
                )

            );


        if(
            distance < 1.5
        ){

            /*
                Gejagten verlieren
            */

            const targetRef =
                ref(
                    db,
                    playersPath +
                    "/" +
                    id +
                    "/dead"
                );


            set(
                targetRef,
                true
            );

        }

    }

}


/* =====================================================
   DEATH CHECK
===================================================== */

function checkDeath(){

    if(
        isMonster
    )
        return;


    const myRef =
        ref(
            db,
            playersPath +
            "/" +
            uid +
            "/dead"
        );


    onValue(
        myRef,
        snapshot => {

            if(
                snapshot.val() === true
            ){

                loseGame();

            }

        }
    );

}


/* =====================================================
   LOSE
===================================================== */

let alreadyDead =
    false;


function loseGame(){

    if(
        alreadyDead
    )
        return;


    alreadyDead =
        true;


    document.exitPointerLock();


    document.getElementById(
        "dead"
    ).style.display =
        "flex";

}


/* =====================================================
   ABILITY
===================================================== */

let abilityCooldown =
    0;


function ability(){

    if(
        abilityCooldown > 0
    )
        return;


    abilityCooldown =
        6;


    /*
        MONSTER
    */

    if(
        isMonster
    ){

        let closest =
            null;


        let distance =
            Infinity;


        for(
            const id in networkPlayers
        ){

            const p =
                networkPlayers[id];


            if(
                p.monster
            )
                continue;


            const d =
                player.position.distanceTo(

                    new THREE.Vector3(
                        p.x,
                        p.y,
                        p.z
                    )

                );


            if(
                d < distance
            ){

                distance =
                    d;


                closest =
                    p;

            }

        }


        if(
            closest &&
            distance < 18
        ){

            monsterJumpscare();

        }

    }


    /*
        GEJAGTER
    */

    else{

        throwFlashbang();

    }

}


/* =====================================================
   JUMPSCARE
===================================================== */

function monsterJumpscare(){

    const element =
        document.getElementById(
            "jumpscare"
        );


    element.style.opacity =
        1;


    const face =
        document.getElementById(
            "jumpscareFace"
        );


    face.style.transform =
        "scale(1.5)";


    setTimeout(
        () => {

            face.style.transform =
                "scale(1)";

        },
        120
    );


    setTimeout(
        () => {

            element.style.opacity =
                0;

        },
        850
    );

}


/* =====================================================
   FLASHBANG
===================================================== */

function throwFlashbang(){

    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    dir.applyQuaternion(
        camera.quaternion
    );


    const pos =
        camera.position.clone();


    pos.add(
        dir.multiplyScalar(3)
    );


    explodeFlashbang(
        pos,
        .45
    );

}


/* =====================================================
   FLASH EFFECT
===================================================== */

function explodeFlashbang(
    position,
    strength=1
){

    const light =
        new THREE.PointLight(
            0xffffff,
            100 * strength,
            40
        );


    light.position.copy(
        position
    );


    scene.add(
        light
    );


    let power =
        1;


    const interval =
        setInterval(
            () => {

                power *= .78;


                light.intensity =
                    100 *
                    strength *
                    power;


                if(
                    power < .02
                ){

                    clearInterval(
                        interval
                    );


                    scene.remove(
                        light
                    );

                }

            },
            40
        );


    flashScreen(
        position,
        strength
    );

}


/* =====================================================
   SCREEN FLASH
===================================================== */

function flashScreen(
    position,
    strength
){

    const distance =
        camera.position.distanceTo(
            position
        );


    const max =
        30;


    if(
        distance > max
    )
        return;


    let power =
        1 -
        distance / max;


    power =
        Math.pow(
            Math.max(
                0,
                power
            ),
            .7
        );


    power *=
        strength;


    const flash =
        document.getElementById(
            "flash"
        );


    flash.style.opacity =
        Math.min(
            1,
            power
        );


    setTimeout(
        () => {

            flash.style.opacity =
                power * .35;

        },
        120
    );


    setTimeout(
        () => {

            flash.style.opacity =
                0;

        },
        700
    );

}


/* =====================================================
   DANGER
===================================================== */

function dangerEffect(){

    if(
        isMonster
    ){

        document.getElementById(
            "danger"
        ).style.opacity =
            0;


        return;

    }


    let nearest =
        Infinity;


    for(
        const id in networkPlayers
    ){

        const p =
            networkPlayers[id];


        if(
            !p ||
            !p.monster
        )
            continue;


        const distance =
            player.position.distanceTo(

                new THREE.Vector3(
                    p.x,
                    p.y,
                    p.z
                )

            );


        nearest =
            Math.min(
                nearest,
                distance
            );

    }


    if(
        nearest < 15
    ){

        const intensity =
            1 -
            nearest / 15;


        document.getElementById(
            "danger"
        ).style.opacity =
            intensity * .7;

    }else{

        document.getElementById(
            "danger"
        ).style.opacity =
            0;

    }

}


/* =====================================================
   ANIMATION
===================================================== */

let last =
    performance.now();


let sendTimer =
    0;


function animate(
    time
){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            (time-last)/1000,
            .05
        );


    last =
        time;


    movePlayer(
        dt
    );


    smoothRemotePlayers();


    updateCamera();


    sendTimer +=
        dt;


    if(
        sendTimer >= .05
    ){

        sendTimer =
            0;

    }


    checkMonster();


    dangerEffect();


    if(
        abilityCooldown > 0
    ){

        abilityCooldown -=
            dt;

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   START
===================================================== */

login();

animate(
    performance.now()
);

</script>
