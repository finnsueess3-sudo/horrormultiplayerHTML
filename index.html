<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HorrorWorld Multiplayer Test</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

#game {
    position: fixed;
    inset: 0;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;

    background: rgba(0,0,0,0.65);
    color: white;

    padding: 12px 16px;
    border-radius: 10px;

    font-size: 16px;
}

#status {
    margin-top: 5px;
    color: #7cff7c;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,0.45);
}

#startBox {
    background: white;
    padding: 35px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

#startBox h1 {
    margin-top: 0;
}

button {
    border: none;
    background: #222;
    color: white;

    padding: 14px 25px;

    border-radius: 8px;

    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    transform: translate(-50%, -50%);

    z-index: 5;

    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";

    position: absolute;

    background: white;
}

#crosshair::before {
    width: 12px;
    height: 2px;

    left: -1px;
    top: 4px;
}

#crosshair::after {
    width: 2px;
    height: 12px;

    left: 4px;
    top: -1px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div>Spieler: <span id="playerCount">0</span></div>
    <div>Rolle: <span id="role">-</span></div>
    <div id="status">Verbinde...</div>
</div>

<div id="crosshair"></div>

<div id="startScreen">
    <div id="startBox">
        <h1>Multiplayer Test</h1>

        <p>
            Öffne das Spiel auf zwei PCs.<br>
            Jeder PC wird automatisch verbunden.
        </p>

        <p>
            <b>WASD</b> = Bewegung<br>
            <b>Shift</b> = Sprint<br>
            <b>Space</b> = Springen<br>
            <b>Maus</b> = Umschauen
        </p>

        <button id="startButton">
            SPIEL STARTEN
        </button>
    </div>
</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    update,
    remove,
    onValue,
    onDisconnect,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyBiQVy6ItxzIhFqPI6ErUXsVw59IYu3Fos",
    authDomain: "horrorworld-1e247.firebaseapp.com",
    projectId: "horrorworld-1e247",
    storageBucket: "horrorworld-1e247.firebasestorage.app",
    messagingSenderId: "424446705755",
    appId: "1:424446705755:web:685456892782994530ff7e"
};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

/*
    WICHTIG:
    Die Datenbank liegt in europe-west1.
*/
const db = getDatabase(
    firebaseApp,
    "https://horrorworld-1e247-default-rtdb.europe-west1.firebasedatabase.app"
);


/* =========================================================
   THREE.JS
========================================================= */

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   HTML
========================================================= */

const game = document.getElementById("game");

const playerCountText =
    document.getElementById("playerCount");

const roleText =
    document.getElementById("role");

const statusText =
    document.getElementById("status");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");


/* =========================================================
   THREE SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

camera.position.set(
    0,
    2,
    5
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

game.appendChild(renderer.domElement);


/* =========================================================
   LIGHT
========================================================= */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    50,
    100,
    50
);

sun.castShadow = true;

scene.add(sun);


const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.2
    );

scene.add(ambient);


/* =========================================================
   GROUND
========================================================= */

const groundGeometry =
    new THREE.PlaneGeometry(
        300,
        300
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x55aa55
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   ROAD
========================================================= */

const roadGeometry =
    new THREE.BoxGeometry(
        20,
        0.1,
        300
    );

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x666666
    });

const road =
    new THREE.Mesh(
        roadGeometry,
        roadMaterial
    );

road.position.y = 0.05;

road.receiveShadow = true;

scene.add(road);


/* =========================================================
   ROAD LINES
========================================================= */

for (
    let z = -140;
    z <= 140;
    z += 12
) {

    const lineGeometry =
        new THREE.BoxGeometry(
            0.5,
            0.12,
            6
        );

    const lineMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffffff
        });

    const line =
        new THREE.Mesh(
            lineGeometry,
            lineMaterial
        );

    line.position.set(
        0,
        0.12,
        z
    );

    scene.add(line);
}


/* =========================================================
   HOUSE FUNCTION
========================================================= */

function createHouse(x, z) {

    const houseGroup =
        new THREE.Group();


    /* HOUSE */

    const bodyGeometry =
        new THREE.BoxGeometry(
            12,
            6,
            10
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffd7a8
        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.position.y = 3;

    body.castShadow = true;
    body.receiveShadow = true;

    houseGroup.add(body);


    /* ROOF */

    const roofGeometry =
        new THREE.ConeGeometry(
            8.5,
            4,
            4
        );

    const roofMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xaa3333
        });

    const roof =
        new THREE.Mesh(
            roofGeometry,
            roofMaterial
        );

    roof.position.y = 8;

    roof.rotation.y =
        Math.PI / 4;

    roof.castShadow = true;

    houseGroup.add(roof);


    /* DOOR */

    const doorGeometry =
        new THREE.BoxGeometry(
            2,
            3.5,
            0.2
        );

    const doorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x553322
        });

    const door =
        new THREE.Mesh(
            doorGeometry,
            doorMaterial
        );

    door.position.set(
        0,
        1.75,
        5.1
    );

    houseGroup.add(door);


    houseGroup.position.set(
        x,
        0,
        z
    );

    scene.add(houseGroup);
}


/* =========================================================
   HOUSES
========================================================= */

createHouse(-35, -30);
createHouse(35, -70);
createHouse(-35, -110);

createHouse(35, 20);
createHouse(-35, 70);
createHouse(35, 120);


/* =========================================================
   TREE FUNCTION
========================================================= */

function createTree(x, z) {

    const tree =
        new THREE.Group();


    const trunkGeometry =
        new THREE.CylinderGeometry(
            0.8,
            1,
            4,
            8
        );

    const trunkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x6b3f20
        });

    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );

    trunk.position.y = 2;

    trunk.castShadow = true;

    tree.add(trunk);


    const leavesGeometry =
        new THREE.SphereGeometry(
            3,
            12,
            12
        );

    const leavesMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x228b22
        });

    const leaves =
        new THREE.Mesh(
            leavesGeometry,
            leavesMaterial
        );

    leaves.position.y = 5;

    leaves.castShadow = true;

    tree.add(leaves);


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);
}


/* =========================================================
   TREES
========================================================= */

const treePositions = [

    [-15, -20],
    [15, -40],
    [-15, -60],
    [15, -90],
    [-15, -100],
    [15, -130],

    [-60, -10],
    [60, -30],
    [-60, 40],
    [60, 60],
    [-60, 100],
    [60, 130]

];

for (const pos of treePositions) {
    createTree(pos[0], pos[1]);
}


/* =========================================================
   LOCAL PLAYER
========================================================= */

const playerGeometry =
    new THREE.CapsuleGeometry(
        0.6,
        1.2,
        8,
        16
    );

const playerMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3366ff
    });

const player =
    new THREE.Mesh(
        playerGeometry,
        playerMaterial
    );

player.position.set(
    0,
    1.2,
    10
);

player.castShadow = true;

scene.add(player);


/* =========================================================
   PLAYER VARIABLES
========================================================= */

let uid = null;

let myRole = "player";

let started = false;

let velocityY = 0;

let grounded = true;

const keys = {};

let yaw = 0;

let pitch = 0;


/* =========================================================
   OTHER PLAYERS
========================================================= */

const otherPlayers = {};


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;

        if (
            event.code === "Space" &&
            grounded
        ) {

            velocityY = 8;

            grounded = false;
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] = false;
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (!started) return;

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) return;


        yaw -= event.movementX * 0.002;

        pitch -= event.movementY * 0.002;


        pitch =
            Math.max(
                -1.4,
                Math.min(
                    1.4,
                    pitch
                )
            );
    }
);


/* =========================================================
   CLICK TO LOCK MOUSE
========================================================= */

renderer.domElement.addEventListener(
    "click",
    () => {

        if (started) {

            renderer.domElement.requestPointerLock();

        }

    }
);


/* =========================================================
   FIREBASE LOGIN
========================================================= */

async function login() {

    statusText.textContent =
        "Verbinde mit Firebase...";

    try {

        await signInAnonymously(auth);

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Firebase Login Fehler";

        alert(
            "Firebase Login funktioniert nicht.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) return;

        uid = user.uid;

        console.log(
            "Meine UID:",
            uid
        );

        await setupPlayer();

    }
);


/* =========================================================
   SETUP PLAYER
========================================================= */

async function setupPlayer() {

    const playersRef =
        ref(
            db,
            "games/main/players"
        );


    const myPlayerRef =
        ref(
            db,
            "games/main/players/" + uid
        );


    const monsterRef =
        ref(
            db,
            "games/main/monsterId"
        );


    /*
        Wenn der Spieler die Verbindung verliert,
        wird er automatisch entfernt.
    */

    onDisconnect(
        myPlayerRef
    ).remove();


    /*
        Prüfen, ob bereits ein Monster existiert.
    */

    const result =
        await runTransaction(
            monsterRef,
            current => {

                if (
                    current === null
                ) {

                    return uid;

                }

                return current;

            }
        );


    const monsterId =
        result.snapshot.val();


    if (monsterId === uid) {

        myRole = "monster";

    } else {

        myRole = "player";

    }


    roleText.textContent =
        myRole === "monster"
            ? "MONSTER"
            : "SPIELER";


    /*
        Spieler speichern
    */

    await set(
        myPlayerRef,
        {
            x: player.position.x,
            y: player.position.y,
            z: player.position.z,

            rotation: 0,

            role: myRole,

            joinedAt:
                Date.now()
        }
    );


    statusText.textContent =
        "Verbunden";


    /*
        Andere Spieler beobachten
    */

    onValue(
        playersRef,
        snapshot => {

            const data =
                snapshot.val() || {};

            updateOtherPlayers(data);

        }
    );


    /*
        Spielerzahl
    */

    onValue(
        playersRef,
        snapshot => {

            const data =
                snapshot.val() || {};

            const count =
                Object.keys(data).length;

            playerCountText.textContent =
                count;


            if (count >= 2) {

                statusText.textContent =
                    "2 Spieler verbunden!";

            } else {

                statusText.textContent =
                    "Warte auf Spieler...";

            }

        }
    );


    /*
        Eigene Position regelmäßig senden
    */

    setInterval(
        () => {

            if (!uid) return;

            update(
                myPlayerRef,
                {
                    x: player.position.x,
                    y: player.position.y,
                    z: player.position.z,

                    rotation: yaw,

                    role: myRole
                }
            );

        },
        50
    );
}


/* =========================================================
   CREATE OTHER PLAYER
========================================================= */

function createOtherPlayer(
    id,
    data
) {

    const geometry =
        new THREE.CapsuleGeometry(
            0.6,
            1.2,
            8,
            16
        );


    let color =
        0x3366ff;


    if (
        data.role === "monster"
    ) {

        color =
            0xff2222;

    }


    const material =
        new THREE.MeshStandardMaterial({
            color: color
        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        data.x || 0,
        data.y || 1.2,
        data.z || 0
    );


    mesh.castShadow = true;


    scene.add(mesh);


    otherPlayers[id] = mesh;
}


/* =========================================================
   UPDATE OTHER PLAYERS
========================================================= */

function updateOtherPlayers(data) {

    const existingIds =
        Object.keys(otherPlayers);


    /*
        Neue Spieler
    */

    for (
        const id in data
    ) {

        if (
            id === uid
        ) continue;


        const playerData =
            data[id];


        if (
            !otherPlayers[id]
        ) {

            createOtherPlayer(
                id,
                playerData
            );

        } else {

            const mesh =
                otherPlayers[id];


            mesh.position.set(
                playerData.x || 0,
                playerData.y || 1.2,
                playerData.z || 0
            );


            mesh.rotation.y =
                playerData.rotation || 0;


            /*
                Farbe aktualisieren
            */

            if (
                playerData.role ===
                "monster"
            ) {

                mesh.material.color.set(
                    0xff2222
                );

            } else {

                mesh.material.color.set(
                    0x3366ff
                );

            }

        }

    }


    /*
        Spieler entfernen,
        die nicht mehr in Firebase sind.
    */

    for (
        const id of existingIds
    ) {

        if (
            !data[id]
        ) {

            scene.remove(
                otherPlayers[id]
            );

            delete otherPlayers[id];

        }

    }
}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        started = true;

        startScreen.style.display =
            "none";


        renderer.domElement.requestPointerLock();

    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    delta
) {

    if (!started) return;


    const speed =
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
            ? 12
            : 7;


    let forward = 0;
    let right = 0;


    if (
        keys["KeyW"] ||
        keys["ArrowUp"]
    ) {

        forward += 1;

    }


    if (
        keys["KeyS"] ||
        keys["ArrowDown"]
    ) {

        forward -= 1;

    }


    if (
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) {

        right += 1;

    }


    if (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) {

        right -= 1;

    }


    const direction =
        new THREE.Vector3(
            right,
            0,
            -forward
        );


    if (
        direction.length() > 0
    ) {

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );


        player.position.x +=
            direction.x *
            speed *
            delta;


        player.position.z +=
            direction.z *
            speed *
            delta;

    }


    /*
        Springen
    */

    velocityY -=
        20 * delta;


    player.position.y +=
        velocityY * delta;


    if (
        player.position.y <= 1.2
    ) {

        player.position.y = 1.2;

        velocityY = 0;

        grounded = true;

    }


    /*
        Spieler nicht zu weit weg
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -140,
            140
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -145,
            145
        );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    const cameraDistance = 5;

    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 1.5,
            player.position.z
        );


    camera.position.copy(
        target
    );


    const direction =
        new THREE.Vector3(
            0,
            0,
            cameraDistance
        );


    direction.applyEuler(
        new THREE.Euler(
            pitch,
            yaw,
            0,
            "YXZ"
        )
    );


    camera.position.add(
        direction
    );


    camera.lookAt(
        target
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function animate() {

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    const delta =
        Math.min(
            (now - lastTime) / 1000,
            0.05
        );


    lastTime = now;


    updateMovement(
        delta
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   START FIREBASE
========================================================= */

login();


</script>

</body>
</html>
