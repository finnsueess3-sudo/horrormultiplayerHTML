<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HorrorWorld Multiplayer Test</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
}

#game {
  position: fixed;
  inset: 0;
}

#status {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 20;

  padding: 10px 15px;

  background: rgba(0,0,0,.7);
  color: white;

  border-radius: 8px;

  font-size: 14px;
}

#hud {
  position: fixed;

  left: 20px;
  bottom: 20px;

  z-index: 20;

  background: rgba(0,0,0,.65);

  color: white;

  padding: 15px;

  border-radius: 10px;

  min-width: 220px;
}

#role {
  font-size: 20px;
  font-weight: bold;
}

#players {
  margin-top: 8px;
}

#help {

  position: fixed;

  right: 20px;
  bottom: 20px;

  z-index: 20;

  background: rgba(0,0,0,.65);

  color: white;

  padding: 12px;

  border-radius: 10px;

  line-height: 1.6;

  font-size: 13px;
}

#start {

  position: fixed;

  inset: 0;

  z-index: 30;

  display: flex;

  align-items: center;

  justify-content: center;

  background: linear-gradient(
    #87ceeb,
    #dff6ff
  );
}

#startBox {

  text-align: center;

  background: rgba(255,255,255,.95);

  padding: 40px;

  border-radius: 20px;

  box-shadow: 0 15px 50px rgba(0,0,0,.25);
}

#startBox h1 {

  margin: 0;

  font-size: 45px;

  color: #222;
}

#startBox p {

  color: #555;
}

button {

  border: 0;

  padding: 14px 30px;

  border-radius: 10px;

  background: #2277dd;

  color: white;

  font-size: 17px;

  cursor: pointer;
}

button:hover {

  background: #1155aa;

}

</style>
</head>


<body>


<div id="game"></div>


<div id="status">
🟡 Firebase: Verbinde...
</div>


<div id="hud">

  <div id="role">
    Rolle: wird geladen...
  </div>

  <div id="players">
    Spieler: 0
  </div>

</div>


<div id="help">

<b>Steuerung</b><br>

WASD – Bewegen<br>

SHIFT – Sprint<br>

SPACE – Springen<br>

Maus – Umschauen

</div>


<div id="start">

  <div id="startBox">

    <h1>WORLD TEST</h1>

    <p>Helle Multiplayer-Testkarte</p>

    <br>

    <button id="startButton">
      SPIEL STARTEN
    </button>

  </div>

</div>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

  getAuth,

  signInAnonymously,

  onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

  getDatabase,

  ref,

  set,

  update,

  remove,

  onValue,

  onDisconnect,

  runTransaction

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */


const firebaseConfig = {

  apiKey:
    "AIzaSyBiQVy6ItxzIhFqPI6ErUXsVw59IYu3Fos",

  authDomain:
    "horrorworld-1e247.firebaseapp.com",

  projectId:
    "horrorworld-1e247",

  storageBucket:
    "horrorworld-1e247.firebasestorage.app",

  messagingSenderId:
    "424446705755",

  appId:
    "1:424446705755:web:685456892782994530ff7e"

};



const firebaseApp =
  initializeApp(firebaseConfig);


const auth =
  getAuth(firebaseApp);


const db =
  getDatabase(firebaseApp);



/* =========================================================
   THREE
========================================================= */


import * as THREE

from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";



/* =========================================================
   VARIABLES
========================================================= */


let myId = null;

let myPlayerRef = null;

let players = {};

let otherPlayers = {};

let isMonster = false;

let gameStarted = false;

let velocityY = 0;

let rotationY = 0;

let rotationX = 0;

let lastNetworkUpdate = 0;


const keys = {};


const speed = 5;

const sprintSpeed = 9;

const gravity = 20;

const jumpPower = 8;



/* =========================================================
   SCENE
========================================================= */


const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(
    0x87ceeb
  );



/* =========================================================
   CAMERA
========================================================= */


const camera =
  new THREE.PerspectiveCamera(

    75,

    innerWidth /
    innerHeight,

    0.1,

    1000

  );



camera.position.set(
  0,
  2,
  5
);



/* =========================================================
   RENDERER
========================================================= */


const renderer =
  new THREE.WebGLRenderer({

    antialias: true

  });


renderer.setSize(
  innerWidth,
  innerHeight
);


renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    2
  )
);


renderer.shadowMap.enabled =
  true;


document
  .getElementById("game")
  .appendChild(
    renderer.domElement
  );



/* =========================================================
   LIGHT
========================================================= */


const ambient =
  new THREE.AmbientLight(

    0xffffff,

    1.2

  );


scene.add(
  ambient
);



const sun =
  new THREE.DirectionalLight(

    0xffffff,

    2

  );


sun.position.set(
  50,
  100,
  50
);


sun.castShadow =
  true;


scene.add(
  sun
);



/* =========================================================
   GROUND
========================================================= */


const ground =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      500,
      500
    ),

    new THREE.MeshStandardMaterial({

      color:
        0x55aa55,

      roughness:
        1

    })

  );


ground.rotation.x =
  -Math.PI / 2;


ground.receiveShadow =
  true;


scene.add(
  ground
);



/* =========================================================
   ROAD
========================================================= */


const road =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      30,
      500
    ),

    new THREE.MeshStandardMaterial({

      color:
        0x777777

    })

  );


road.rotation.x =
  -Math.PI / 2;


road.position.y =
  0.01;


scene.add(
  road
);



/* =========================================================
   ROAD LINES
========================================================= */


for (
  let z = -240;
  z < 250;
  z += 12
) {

  const line =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        1,
        0.05,
        6
      ),

      new THREE.MeshStandardMaterial({

        color:
          0xffffff

      })

    );


  line.position.set(
    0,
    0.04,
    z
  );


  scene.add(
    line
  );

}



/* =========================================================
   HOUSE
========================================================= */


function createHouse(
  x,
  z
) {


  const group =
    new THREE.Group();


  const wall =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        12,
        6,
        10
      ),

      new THREE.MeshStandardMaterial({

        color:
          0xf0d0a0

      })

    );


  wall.position.y =
    3;


  wall.castShadow =
    true;


  wall.receiveShadow =
    true;


  group.add(
    wall
  );



  const roof =
    new THREE.Mesh(

      new THREE.ConeGeometry(
        9,
        4,
        4
      ),

      new THREE.MeshStandardMaterial({

        color:
          0xaa3333

      })

    );


  roof.position.y =
    8;


  roof.rotation.y =
    Math.PI / 4;


  roof.castShadow =
    true;


  group.add(
    roof
  );



  /* Tür */


  const door =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        2,
        3,
        .2
      ),

      new THREE.MeshStandardMaterial({

        color:
          0x553322

      })

    );


  door.position.set(
    0,
    1.5,
    -5.1
  );


  group.add(
    door
  );



  /* Fenster */


  for (
    const x2 of [-3,3]
  ) {

    const window =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          2,
          2,
          .2
        ),

        new THREE.MeshStandardMaterial({

          color:
            0x66ccff

        })

      );


    window.position.set(
      x2,
      3,
      -5.1
    );


    group.add(
      window
    );

  }



  group.position.set(
    x,
    0,
    z
  );


  scene.add(
    group
  );

}



/* Häuser */


createHouse(
  -35,
  -25
);


createHouse(
  35,
  -50
);


createHouse(
  -45,
  35
);


createHouse(
  45,
  60
);


createHouse(
  -40,
  90
);


createHouse(
  40,
  120
);



/* =========================================================
   TREES
========================================================= */


function createTree(
  x,
  z
) {


  const trunk =
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        .4,
        .55,
        4
      ),

      new THREE.MeshStandardMaterial({

        color:
          0x704020

      })

    );


  trunk.position.set(
    x,
    2,
    z
  );


  trunk.castShadow =
    true;


  scene.add(
    trunk
  );



  const leaves =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        2.7,
        10,
        10
      ),

      new THREE.MeshStandardMaterial({

        color:
          0x228833

      })

    );


  leaves.position.set(
    x,
    5,
    z
  );


  leaves.castShadow =
    true;


  scene.add(
    leaves
  );

}



for (
  let i = 0;
  i < 100;
  i++
) {


  const x =
    (Math.random() - .5)
    * 300;


  const z =
    (Math.random() - .5)
    * 300;



  if (
    Math.abs(x) < 20
  )
    continue;


  createTree(
    x,
    z
  );

}



/* =========================================================
   PLAYER
========================================================= */


const player =
  new THREE.Group();


const playerBody =
  new THREE.Mesh(

    new THREE.CapsuleGeometry(
      .35,
      1,
      4,
      8
    ),

    new THREE.MeshStandardMaterial({

      color:
        0xeeeeee

    })

  );


playerBody.position.y =
  1;


playerBody.castShadow =
  true;


player.add(
  playerBody
);


scene.add(
  player
);



/* =========================================================
   KEYBOARD
========================================================= */


document.addEventListener(
  "keydown",
  e => {

    keys[e.code] =
      true;

  }
);


document.addEventListener(
  "keyup",
  e => {

    keys[e.code] =
      false;

  }
);



/* =========================================================
   MOUSE
========================================================= */


document.addEventListener(
  "mousemove",
  e => {

    if (
      !gameStarted
    )
      return;


    if (
      document.pointerLockElement !==
      renderer.domElement
    )
      return;


    rotationY -=
      e.movementX *
      0.002;


    rotationX -=
      e.movementY *
      0.002;


    rotationX =
      Math.max(
        -1.4,
        Math.min(
          1.4,
          rotationX
        )
      );

  }
);



/* =========================================================
   JUMP
========================================================= */


document.addEventListener(
  "keydown",
  e => {

    if (
      e.code === "Space" &&
      Math.abs(
        velocityY
      ) < .1 &&
      gameStarted
    ) {

      velocityY =
        jumpPower;

    }

  }
);



/* =========================================================
   FIREBASE LOGIN
========================================================= */


signInAnonymously(
  auth
)
.catch(
  error => {

    console.error(
      error
    );


    document.getElementById(
      "status"
    ).textContent =
      "❌ Firebase Login Fehler";

  }
);



/* =========================================================
   AUTH
========================================================= */


onAuthStateChanged(
  auth,
  async user => {


    if (!user)
      return;



    myId =
      user.uid;



    console.log(
      "MEINE ID:",
      myId
    );



    myPlayerRef =
      ref(

        db,

        "games/main/players/"
        + myId

      );



    /* =====================================================
       MONSTER AUSWÄHLEN
    ===================================================== */


    const monsterRef =
      ref(
        db,
        "games/main/monsterId"
      );


    const result =
      await runTransaction(

        monsterRef,

        current => {

          if (
            current === null
          ) {

            return myId;

          }


          return current;

        }

      );


    isMonster =
      result.snapshot.val()
      === myId;



    updateRole();



    /* =====================================================
       SPIELER SPEICHERN
    ===================================================== */


    await set(

      myPlayerRef,

      {

        x: 0,

        y: 0,

        z: 5,

        rotation: 0,

        role:
          isMonster
          ? "monster"
          : "player",

        online:
          true,

        joinedAt:
          Date.now()

      }

    );



    /* =====================================================
       BEI DISCONNECT LÖSCHEN
    ===================================================== */


    onDisconnect(
      myPlayerRef
    ).remove();



    /* =====================================================
       SPIELER BEOBACHTEN
    ===================================================== */


    const playersRef =
      ref(
        db,
        "games/main/players"
      );


    onValue(

      playersRef,

      snapshot => {

        players =
          snapshot.val()
          || {};


        updatePlayers();

      }

    );


  }
);



/* =========================================================
   ROLE
========================================================= */


function updateRole() {


  const role =
    document.getElementById(
      "role"
    );


  if (
    isMonster
  ) {

    role.textContent =
      "👹 MONSTER";

    role.style.color =
      "#ff2222";

  }

  else {

    role.textContent =
      "🔵 GEJAGTER";

    role.style.color =
      "#55aaff";

  }

}



/* =========================================================
   CREATE OTHER PLAYER
========================================================= */


function createOtherPlayer(
  id,
  data
) {


  const material =
    new THREE.MeshStandardMaterial({

      color:
        data.role === "monster"
        ? 0xff2222
        : 0x2266ff

    });



  const mesh =
    new THREE.Mesh(

      new THREE.CapsuleGeometry(
        .35,
        1,
        4,
        8
      ),

      material

    );


  mesh.position.y =
    1;


  mesh.castShadow =
    true;


  scene.add(
    mesh
  );


  otherPlayers[id] =
    mesh;

}



/* =========================================================
   UPDATE PLAYERS
========================================================= */


function updatePlayers() {


  const ids =
    Object.keys(
      players
    );



  document.getElementById(
    "players"
  ).textContent =
    "Spieler: "
    + ids.length;



  /* Neue Spieler */


  for (
    const id of ids
  ) {


    if (
      id === myId
    )
      continue;



    const data =
      players[id];



    if (!data)
      continue;



    if (
      !otherPlayers[id]
    ) {

      createOtherPlayer(
        id,
        data
      );

    }



    const mesh =
      otherPlayers[id];



    mesh.position.set(

      Number(data.x)
      || 0,

      Number(data.y)
      || 0,

      Number(data.z)
      || 0

    );



    mesh.rotation.y =
      Number(
        data.rotation
      )
      || 0;



    /* Farbe */


    if (
      mesh.material
    ) {

      mesh.material.color.set(

        data.role === "monster"

        ? 0xff2222

        : 0x2266ff

      );

    }

  }



  /* Spieler löschen */


  for (
    const id in otherPlayers
  ) {


    if (
      !players[id]
    ) {

      scene.remove(
        otherPlayers[id]
      );


      otherPlayers[id]
        .geometry
        .dispose();


      otherPlayers[id]
        .material
        .dispose();


      delete otherPlayers[id];

    }

  }

}



/* =========================================================
   SEND POSITION
========================================================= */


function sendPosition(
  time
) {


  if (
    !myPlayerRef
  )
    return;



  if (
    time -
    lastNetworkUpdate
    < 50
  )
    return;



  lastNetworkUpdate =
    time;



  update(

    myPlayerRef,

    {

      x:
        player.position.x,

      y:
        player.position.y,

      z:
        player.position.z,

      rotation:
        rotationY,

      online:
        true

    }

  )
  .catch(
    error => {

      console.error(
        "Position Fehler:",
        error
      );

    }
  );

}



/* =========================================================
   START
========================================================= */


document
  .getElementById(
    "startButton"
  )
  .addEventListener(

    "click",

    () => {

      gameStarted =
        true;


      document.getElementById(
        "start"
      ).style.display =
        "none";


      renderer.domElement
        .requestPointerLock();

    }

  );



/* =========================================================
   GAME LOOP
========================================================= */


let previousTime =
  performance.now();



function animate(
  time
) {


  requestAnimationFrame(
    animate
  );



  const dt =
    Math.min(

      (
        time -
        previousTime
      ) / 1000,

      .05

    );



  previousTime =
    time;



  if (
    gameStarted
  ) {


    let moveSpeed =
      keys["ShiftLeft"] ||
      keys["ShiftRight"]

      ? sprintSpeed

      : speed;



    let forward = 0;

    let sideways = 0;



    if (
      keys["KeyW"]
    )
      forward++;


    if (
      keys["KeyS"]
    )
      forward--;


    if (
      keys["KeyA"]
    )
      sideways--;


    if (
      keys["KeyD"]
    )
      sideways++;



    const direction =
      new THREE.Vector3(

        sideways,

        0,

        -forward

      );



    if (
      direction.length() > 0
    ) {


      direction.normalize();



      direction.applyAxisAngle(

        new THREE.Vector3(
          0,
          1,
          0
        ),

        rotationY

      );



      player.position.add(

        direction.multiplyScalar(

          moveSpeed * dt

        )

      );

    }



    /* Gravity */


    velocityY -=
      gravity * dt;


    player.position.y +=
      velocityY * dt;



    if (
      player.position.y < 0
    ) {

      player.position.y =
        0;

      velocityY =
        0;

    }



    /* Kamera */


    camera.position.copy(
      player.position
    );


    camera.position.y +=
      1.7;



    camera.rotation.order =
      "YXZ";


    camera.rotation.y =
      rotationY;


    camera.rotation.x =
      rotationX;



    sendPosition(
      time
    );

  }



  renderer.render(
    scene,
    camera
  );

}



animate(
  performance.now()
);



/* =========================================================
   RESIZE
========================================================= */


window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      innerWidth,

      innerHeight

    );

  }
);


</script>

</body>
</html>
